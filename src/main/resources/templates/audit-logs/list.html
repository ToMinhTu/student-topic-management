<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Nhật ký hệ thống</title></head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2><i class="bi bi-clock-history me-2"></i>Nhật ký hệ thống</h2><p class="text-muted mb-0">100 thao tác nghiệp vụ gần nhất</p></div>
    </div>
    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>ID</th><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead>
            <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}"></td>
                    <td th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td th:text="${log.actor != null ? log.actor.fullname : 'Hệ thống'}"></td>
                    <td><span class="badge text-bg-info" th:text="${log.action}"></span></td>
                    <td th:text="${log.targetType + (log.targetId == null ? '' : ' #' + log.targetId)}"></td>
                    <td class="text-muted" th:text="${log.details}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}"><td colspan="6" class="text-center text-muted py-5">Chưa có nhật ký hệ thống</td></tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>
