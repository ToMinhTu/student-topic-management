<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Nhật ký hệ thống</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h1 class="page-title-tab mb-0">NHẬT KÝ THAO TÁC HỆ THỐNG (AUDIT LOG)</h1>
        </div>

        <div class="content-card p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle border mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4" style="width: 80px;">ID</th>
                            <th>Thời gian</th>
                            <th>Người thực hiện</th>
                            <th>Hành động</th>
                            <th>Đối tượng</th>
                            <th class="pe-4">Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td class="ps-4 text-muted" th:text="${log.id}">1</td>
                            <td th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026 10:00:00
                            </td>
                            <td>
                                <span class="fw-bold"
                                    th:text="${log.actor != null ? log.actor.fullname : 'Hệ thống'}">ADMIN</span>
                            </td>
                            <td>
                                <span class="badge bg-info text-dark"
                                    th:text="${log.action}">ANNOUNCEMENT_PUBLISHED</span>
                            </td>
                            <td th:text="${log.targetType + ' #' + log.targetId}">ANNOUNCEMENT #1</td>
                            <td class="pe-4 text-secondary" th:text="${log.details}">Đã công bố thông báo...</td>
                        </tr>
                        <!-- Empty list -->
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="text-center text-muted py-4">Chưa có nhật ký nào được ghi nhận.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
