<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề tài của tôi</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/part-b.css}">
        <link rel="stylesheet" th:href="@{/css/topics.css}">
    </th:block>
</head>
<body>
<main layout:fragment="content" class="part-b-page topics-page">
    <div class="topics-heading">
        <div>
            <h1>Quản lý đề xuất đề tài</h1>
            <p>Theo dõi và quản lý các đề xuất đề tài của bạn.</p>
        </div>
        <a class="btn btn-theme" th:href="@{/topics/new}"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Tạo đề xuất mới</a>
    </div>
    <p class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></p>
    <p class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p>
    <section class="topics-card" aria-labelledby="topics-list-title">
        <div class="topics-card-heading">
            <h2 id="topics-list-title"><i class="bi bi-journal-text me-2" aria-hidden="true"></i>Danh sách đề xuất</h2>
            <span class="topics-count" th:text="${topics.totalElements + ' đề tài'}"></span>
        </div>
        <div class="b-table-scroll">
            <table class="table align-middle">
                <thead><tr><th scope="col">ID</th><th scope="col">Mã đề tài</th><th scope="col">Tên đề tài</th><th scope="col">Trạng thái</th><th scope="col" class="text-end">Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="topic : ${topics.content}">
                    <td class="topics-id"><span th:text="${'#' + topic.id}"></span></td>
                    <td><span class="topics-code" th:text="${topic.code}"></span></td>
                    <td class="topics-title" th:text="${topic.title}"></td>
                    <td><span class="topic-status" th:attr="data-status=${topic.status}" th:switch="${topic.status.name()}">
                        <span th:case="'DRAFT'">Bản nháp</span><span th:case="'SUBMITTED'">Chờ xét duyệt</span><span th:case="'APPROVED'">Đã phê duyệt</span><span th:case="'PUBLISHED'">Đã công bố</span><span th:case="'REJECTED'">Bị từ chối</span><span th:case="*" th:text="${topic.status}"></span>
                    </span></td>
                    <td class="text-end"><a class="btn topics-view text-nowrap" th:href="@{/topics/{id}(id=${topic.id})}" th:attr="aria-label=${'Xem chi tiết đề tài ' + topic.code}"><i class="bi bi-eye me-1" aria-hidden="true"></i>Chi tiết</a></td>
                </tr>
                <tr th:if="${topics.empty}"><td colspan="5"><div class="empty-box"><i class="bi bi-journal-plus empty-icon d-block" aria-hidden="true"></i><strong>Bạn chưa có đề xuất nào</strong><p class="text-muted mb-0 mt-2">Chọn “Tạo đề xuất mới” để bắt đầu.</p></div></td></tr>
                </tbody>
            </table>
        </div>
        <nav class="topics-pagination" aria-label="Phân trang đề tài">
            <span th:text="${'Tổng cộng ' + topics.totalElements + ' đề tài'}"></span>
            <div class="d-flex align-items-center gap-3" th:if="${topics.totalPages > 1}">
                <a class="btn btn-sm btn-outline-secondary" th:if="${topics.hasPrevious()}" th:href="@{/topics/my(page=${topics.number - 1})}">Trang trước</a>
                <span th:text="${'Trang ' + (topics.number + 1) + ' / ' + topics.totalPages}"></span>
                <a class="btn btn-sm btn-outline-secondary" th:if="${topics.hasNext()}" th:href="@{/topics/my(page=${topics.number + 1})}">Trang sau</a>
            </div>
        </nav>
    </section>
</main>
</body>
</html>
