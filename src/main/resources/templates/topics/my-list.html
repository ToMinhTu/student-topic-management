<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề tài của tôi</title>
<th:block layout:fragment="css"><link rel="stylesheet" th:href="@{/css/part-b.css}"></th:block>
</head>
<body>
<main layout:fragment="content" class="part-b-page">

<div class="b-page-heading"><h1 class="page-title-tab mb-0">Đề tài của tôi</h1></div>

<p><a class="btn btn-theme" th:href="@{/topics/new}">Tạo đề xuất mới</a></p>

<p class="alert alert-success" th:if="${success}" th:text="${success}"></p>
<p role="alert" th:if="${error}" th:text="${error}" style="color: #b91c1c"></p>

<div class="b-table-scroll"><table class="table align-middle">
    <thead>
    <tr>
        <th>ID</th>
        <th>Mã đề tài</th>
        <th>Tên đề tài</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="topic : ${topics.content}">
        <td th:text="${topic.id}"></td>
        <td th:text="${topic.code}"></td>
        <td th:text="${topic.title}"></td>
        <td th:text="${topic.status}"></td>
        <td>
            <a th:href="@{/topics/{id}(id=${topic.id})}">Chi tiết</a>
        </td>
    </tr>
    <tr th:if="${topics.empty}">
        <td colspan="5">Bạn chưa có đề xuất nào.</td>
    </tr>
    </tbody>
</table></div>

<p th:if="${topics.totalPages > 1}">
    <a th:if="${topics.hasPrevious()}"
       th:href="@{/topics/my(page=${topics.number - 1})}">
        Trang trước
    </a>

    <span th:text="${topics.number + 1}"></span>
    /
    <span th:text="${topics.totalPages}"></span>

    <a th:if="${topics.hasNext()}"
       th:href="@{/topics/my(page=${topics.number + 1})}">
        Trang sau
    </a>
</p>

</main>
</body>
</html>
