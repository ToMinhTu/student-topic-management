<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết đề tài</title>
<th:block layout:fragment="css"><link rel="stylesheet" th:href="@{/css/part-b.css}"><link rel="stylesheet" th:href="@{/css/topics.css}"></th:block>
</head>
<body>
<main layout:fragment="content" class="part-b-page topics-page">

<div class="topics-heading"><h1 th:text="${topic.title}">Chi tiết đề tài</h1></div>

<p class="alert alert-success" th:if="${success}" th:text="${success}"></p>
<p class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p>

<section class="topics-card topics-detail" aria-label="Thông tin đề tài"><p><strong>Mã đề tài:</strong>
    <span th:text="${topic.code}"></span></p>

<p><strong>Đợt đăng ký:</strong>
    <span th:text="${topic.roundId}"></span></p>

<p><strong>Bộ môn:</strong>
    <span th:text="${topic.departmentId}"></span></p>

<p><strong>Trạng thái:</strong>
    <span class="topic-status" th:attr="data-status=${topic.status}" th:switch="${topic.status.name()}"><span th:case="'DRAFT'">Bản nháp</span><span th:case="'SUBMITTED'">Chờ xét duyệt</span><span th:case="'APPROVED'">Đã phê duyệt</span><span th:case="'PUBLISHED'">Đã công bố</span><span th:case="'REJECTED'">Bị từ chối</span><span th:case="*" th:text="${topic.status}"></span></span></p>

<p th:if="${topic.rejectionReason}" role="alert"><strong>Lý do từ chối:</strong> <span th:text="${topic.rejectionReason}"></span></p>
<h3>Mô tả</h3>
<p th:text="${topic.description}"></p>

<h3>Yêu cầu</h3>
<p th:text="${topic.requirements}"></p>

</section>

<div class="topics-actions"><div class="actions"
     th:if="${topic.status.name() == 'DRAFT' or topic.status.name() == 'REJECTED'}">

    <a class="btn btn-theme"
       th:href="@{/topics/{id}/edit(id=${topic.id})}">
        Chỉnh sửa
    </a>

    <form th:action="@{/topics/{id}/submit(id=${topic.id})}"
          method="post">
        <button type="submit" class="btn btn-theme">
            Gửi đề xuất
        </button>
    </form>
</div>

<form th:if="${topic.status.name() == 'DRAFT'}"
      th:action="@{/topics/{id}/delete(id=${topic.id})}" method="post"
      onsubmit="return confirm('Bạn có chắc muốn xóa đề xuất nháp này?');">
    <button type="submit" class="btn btn-danger">Xóa đề xuất nháp</button>
</form>
<a class="btn btn-outline-secondary" th:href="@{/topics/my}">Quay lại danh sách</a></div>

</main>
</body>
</html>
