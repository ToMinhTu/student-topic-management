<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề xuất đề tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style layout:fragment="css">
        body {
            margin: 0;
            background: #f4f6f9;
            color: #263238;
            font-family: Arial, sans-serif
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
            max-width: 1200px;
        }

        .topic-page {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 30px auto;
        }

        .topic-page label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        .topic-page input,
        .topic-page textarea,
        .topic-page select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .topic-page textarea {
            min-height: 100px;
        }

        .topic-page .error {
            color: #b91c1c;
        }

        .topic-page button {
            margin-top: 20px;
            padding: 12px 20px;
            cursor: pointer;
        }

        .btn-custom-secondary {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-body);
        }

        .btn-custom-secondary:hover {
            background: #f1f5f9;
            color: var(--text-heading);
            border-color: #cbd5e1;
        }
    </style>
</head>

<body class="py-4">
    <main layout:fragment="content" class="topic-page">

        <div class="container">
            <h1 th:text="${editMode} ? 'Chỉnh sửa đề xuất' : 'Tạo đề xuất mới'"></h1>

            <form th:action="${editMode}
        ? @{/topics/{id}(id=${topicId})}
        : @{/topics}" th:object="${topicForm}" method="post">

                <div class="error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <label for="roundId">Đợt đăng ký</label>
                <select id="roundId" th:field="*{roundId}" th:disabled="${editMode}" required>
                    <option value="">-- Chọn đợt đăng ký --</option>
                    <option th:each="round : ${roundOptions}" th:value="${round.id}" th:text="${round.name}"></option>
                </select>
                <input th:if="${editMode}" type="hidden" th:field="*{roundId}">
                <p class="error" th:errors="*{roundId}"></p>

                <label for="departmentId">Bộ môn</label>
                <select id="departmentId" th:field="*{departmentId}" required>
                    <option value="">-- Chọn bộ môn --</option>
                    <option th:each="department : ${departmentOptions}" th:value="${department.id}"
                        th:text="${department.name}"></option>
                </select>
                <p class="error" th:errors="*{departmentId}"></p>

                <label for="code">Mã đề tài</label>
                <input id="code" type="text" maxlength="40" th:field="*{code}" required>
                <p class="error" th:errors="*{code}"></p>

                <label for="title">Tên đề tài</label>
                <input id="title" type="text" maxlength="255" th:field="*{title}" required>
                <p class="error" th:errors="*{title}"></p>

                <label for="description">Mô tả đề tài</label>
                <textarea id="description" th:field="*{description}" required></textarea>
                <p class="error" th:errors="*{description}"></p>

                <label for="requirements">Yêu cầu</label>
                <textarea id="requirements" th:field="*{requirements}"></textarea>

                <button class="btn btn-danger" type="submit">Lưu đề xuất nháp</button>
                <a th:href="@{/topics/my}" class="btn-custom btn-custom-secondary">
                    <i class="bi bi-arrow-left"></i>Quay lại
                </a>
            </form>

        </div>
    </main>
</body>

</html>
