<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề xuất đề tài</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px;
               margin: 30px auto; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px;
                          box-sizing: border-box; }
        textarea { min-height: 100px; }
        .error { color: #b91c1c; }
        button { margin-top: 20px; padding: 12px 20px;
                 cursor: pointer; }
    </style>
</head>
<body>

<h1 th:text="${editMode} ? 'Chỉnh sửa đề xuất' : 'Tạo đề xuất mới'"></h1>

<form th:action="${editMode}
        ? @{/topics/{id}(id=${topicId})}
        : @{/topics}"
      th:object="${topicForm}"
      method="post">

    <div class="error" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"></p>
    </div>

    <label for="roundId">ID đợt đăng ký</label>
    <input id="roundId" type="number" min="1"
           th:field="*{roundId}" required>
    <p class="error" th:errors="*{roundId}"></p>

    <label for="departmentId">ID bộ môn</label>
    <input id="departmentId" type="number" min="1"
           th:field="*{departmentId}" required>
    <p class="error" th:errors="*{departmentId}"></p>

    <label for="code">Mã đề tài</label>
    <input id="code" type="text" maxlength="40"
           th:field="*{code}" required>
    <p class="error" th:errors="*{code}"></p>

    <label for="title">Tên đề tài</label>
    <input id="title" type="text" maxlength="255"
           th:field="*{title}" required>
    <p class="error" th:errors="*{title}"></p>

    <label for="description">Mô tả đề tài</label>
    <textarea id="description"
              th:field="*{description}" required></textarea>
    <p class="error" th:errors="*{description}"></p>

    <label for="requirements">Yêu cầu</label>
    <textarea id="requirements"
              th:field="*{requirements}"></textarea>

    <button type="submit">Lưu đề xuất nháp</button>
    <a th:href="@{/topics/my}">Quay lại</a>
</form>

</body>
</html>
