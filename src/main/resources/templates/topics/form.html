<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đề xuất đề tài</title>
<th:block layout:fragment="css"><link rel="stylesheet" th:href="@{/css/part-b.css}"></th:block>
</head>
<body>
<main layout:fragment="content" class="part-b-page">

<div class="b-page-heading"><h1 th:text="${editMode} ? 'Chỉnh sửa đề xuất' : 'Tạo đề xuất mới'" class="page-title-tab mb-0"></h1></div>

<form class="content-card b-proposal-form" th:action="${editMode}
        ? @{/topics/{id}(id=${topicId})}
        : @{/topics}"
      th:object="${topicForm}"
      method="post">

    <div class="error" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"></p>
    </div>

        <label class="form-label" for="roundId">Đợt đăng ký</label>
    <select class="form-select" id="roundId" th:field="*{roundId}" th:disabled="${editMode}" required>
        <option value="">-- Chọn đợt đăng ký --</option>
        <option th:each="round : ${roundOptions}" th:value="${round.id}" th:text="${round.name}"></option>
    </select>
    <input class="form-control" th:if="${editMode}" type="hidden" th:field="*{roundId}">
    <p class="error" th:errors="*{roundId}"></p>

        <label class="form-label" for="departmentId">Bộ môn</label>
    <select class="form-select" id="departmentId" th:field="*{departmentId}" required>
        <option value="">-- Chọn bộ môn --</option>
        <option th:each="department : ${departmentOptions}" th:value="${department.id}" th:text="${department.name}"></option>
    </select>
    <p class="error" th:errors="*{departmentId}"></p>

    <label class="form-label" for="code">Mã đề tài</label>
    <input class="form-control" id="code" type="text" maxlength="40"
           th:field="*{code}" required>
    <p class="error" th:errors="*{code}"></p>

    <label class="form-label" for="title">Tên đề tài</label>
    <input class="form-control" id="title" type="text" maxlength="255"
           th:field="*{title}" required>
    <p class="error" th:errors="*{title}"></p>

    <label class="form-label" for="description">Mô tả đề tài</label>
    <textarea class="form-control" id="description"
              th:field="*{description}" required></textarea>
    <p class="error" th:errors="*{description}"></p>

    <label class="form-label" for="requirements">Yêu cầu</label>
    <textarea class="form-control" id="requirements"
              th:field="*{requirements}"></textarea>

    <button type="submit" class="btn btn-theme">Lưu đề xuất nháp</button>
    <a th:href="@{/topics/my}">Quay lại</a>
</form>

</main>
</body>
</html>
