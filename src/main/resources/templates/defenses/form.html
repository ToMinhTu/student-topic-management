<!-- toan-D2 - thêm chức năng quản lý lịch bảo vệ -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Tạo lịch bảo vệ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            color: #263238;
            font-family: Arial, sans-serif
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08)
        }
    </style>
</head>

<body class="py-4">
    <main layout:fragment="content">

        <div class="container py-4" style="max-width: 820px;">
            <h1 class="h3 fw-bold mb-4">Tạo lịch bảo vệ</h1>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="${defenseForm.id == null} ? @{/defenses/save} : @{/defenses/update}"
                th:object="${defenseForm}" method="post">

                <input type="hidden" th:field="*{id}">

                <label>Mã hồ sơ:</label>
                <input class="form-control" type="number" th:field="*{registrationId}">

                <p th:if="${#fields.hasErrors('registrationId')}" th:errors="*{registrationId}">
                </p>

                <br>

                <label>Mã đợt:</label>
                <input class="form-control" type="number" th:field="*{roundId}">

                <p th:if="${#fields.hasErrors('roundId')}" th:errors="*{roundId}">
                </p>

                <br>

                <label>Mã hội đồng:</label>
                <input class="form-control" type="number" th:field="*{councilId}">

                <p th:if="${#fields.hasErrors('councilId')}" th:errors="*{councilId}">
                </p>

                <br>

        <label class="form-label">Thời gian bảo vệ</label>
        <input class="form-control" type="datetime-local" th:field="*{scheduledAt}"
               aria-describedby="defenseDateHint">
        <div id="defenseDateHint" class="form-text">
            Ngày bảo vệ phải trùng ngày hội đồng của đợt đăng ký; chỉ thay đổi giờ bảo vệ.
        </div>

                <p th:if="${#fields.hasErrors('scheduledAt')}" th:errors="*{scheduledAt}">
                </p>

                <br>

                <label>Địa điểm:</label>
                <input class="form-control" type="text" th:field="*{location}">

                <p th:if="${#fields.hasErrors('location')}" th:errors="*{location}">
                </p>

                <br><br>

                <button class="btn btn-primary" type="submit">
                    Lưu lịch bảo vệ
                </button>

            </form>

            <br>

            <a class="btn btn-outline-secondary mt-3" href="/defenses">
                Quay lại danh sách
            </a>

        </div>
    </main>
</body>

</html>
