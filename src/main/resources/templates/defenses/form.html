<!-- toan-D2 - thêm chức năng quản lý lịch bảo vệ -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tạo lịch bảo vệ</title>
</head>

<body>

    <h1>Tạo lịch bảo vệ</h1>

    <form th:action="@{/defenses/save}" th:object="${defenseForm}" method="post">

        <label>Mã hồ sơ:</label>
        <input type="number" th:field="*{registrationId}">

        <p th:if="${#fields.hasErrors('registrationId')}" th:errors="*{registrationId}">
        </p>

        <br>

        <label>Mã đợt:</label>
        <input type="number" th:field="*{roundId}">

        <p th:if="${#fields.hasErrors('roundId')}" th:errors="*{roundId}">
        </p>

        <br>

        <label>Mã hội đồng:</label>
        <input type="number" th:field="*{councilId}">

        <p th:if="${#fields.hasErrors('councilId')}" th:errors="*{councilId}">
        </p>

        <br>

        <label>Thời gian bảo vệ:</label>
        <input type="datetime-local" th:field="*{scheduledAt}">

        <p th:if="${#fields.hasErrors('scheduledAt')}" th:errors="*{scheduledAt}">
        </p>

        <br>

        <label>Địa điểm:</label>
        <input type="text" th:field="*{location}">

        <p th:if="${#fields.hasErrors('location')}" th:errors="*{location}">
        </p>

        <br><br>

        <button type="submit">
            Lưu lịch bảo vệ
        </button>

    </form>

    <br>

    <a href="/defenses">
        Quay lại danh sách
    </a>

</body>

</html>
