<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>Tạo lịch bảo vệ</title></head><body>
<div layout:fragment="content" class="container py-4"><div class="row justify-content-center"><div class="col-lg-8"><div class="mb-4"><h2><i class="bi bi-calendar-plus me-2"></i>Tạo lịch bảo vệ</h2><p class="text-muted">Chỉ hồ sơ đã được duyệt mới có thể lập lịch.</p></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form th:action="@{/defenses/save}" th:object="${defenseForm}" method="post">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Mã hồ sơ</label><input type="number" class="form-control" th:field="*{registrationId}"><div class="text-danger small" th:errors="*{registrationId}"></div></div><div class="col-md-6"><label class="form-label">Mã đợt</label><input type="number" class="form-control" th:field="*{roundId}"><div class="text-danger small" th:errors="*{roundId}"></div></div><div class="col-md-6"><label class="form-label">Mã hội đồng</label><input type="number" class="form-control" th:field="*{councilId}"><div class="text-danger small" th:errors="*{councilId}"></div></div><div class="col-md-6"><label class="form-label">Thời gian bảo vệ</label><input type="datetime-local" class="form-control" th:field="*{scheduledAt}"><div class="text-danger small" th:errors="*{scheduledAt}"></div></div><div class="col-md-6"><label class="form-label">Địa điểm</label><input type="text" class="form-control" placeholder="Ví dụ: Phòng A101" th:field="*{location}"><div class="text-danger small" th:errors="*{location}"></div></div><div class="col-md-6"><label class="form-label">Mã GV phản biện <span class="text-muted">(không bắt buộc)</span></label><input type="number" class="form-control" th:field="*{reviewerLecturerId}"><div class="text-danger small" th:errors="*{reviewerLecturerId}"></div></div></div>
<div class="alert alert-info mt-4 mb-0"><i class="bi bi-info-circle me-2"></i>Hội đồng phải ở trạng thái ACTIVE và cùng đợt với hồ sơ. GV phản biện phải tồn tại trong danh sách giảng viên.</div><div class="d-flex justify-content-end gap-2 mt-4"><a th:href="@{/defenses}" class="btn btn-light">Hủy</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Lưu lịch bảo vệ</button></div></form></div></div></div></div></div></body></html>
