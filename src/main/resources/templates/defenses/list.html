<!-- toan-D2 - thêm chức năng quản lý lịch bảo vệ -->

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Danh sách lịch bảo vệ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            color: #263238;
            font-family: Arial, sans-serif
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
            max-width: 1200px;
        }

        .btn-outline-primary {
            color: #173B34;
            border-color: #173B34;
        }

        .btn-primary {
            background-color: #173B34;
        }

        .btn-outline-primary:hover {
            border-color: #173B34;
            background-color: #173B34;
            color: white;
        }
    </style>
</head>



<body class="py-4">
    <main layout:fragment="content">

        <div class="container" >

            <h1 class="h3 fw-bold mb-3">Danh sách lịch bảo vệ</h1>

            <a sec:authorize="hasAnyRole('LECTURER','DEAN','DEPARTMENT_HEAD')" class="btn btn-primary mb-4" href="/defenses/new">
                Tạo lịch bảo vệ mới
            </a>

            <br><br>

            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hồ sơ</th>
                        <th>Đợt đăng ký</th>
                        <th>Hội đồng bảo vệ</th>
                        <th>Thời gian</th>
                        <th>Địa điểm</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="defense : ${defenses}">
                        <td th:text="${defense.id}"></td>
                        <td th:text="${defense.registrationId}"></td>
                        <td th:text="${roundNames[defense.roundId] ?: 'Không xác định'}"></td>
                        <td th:text="${councilNames[defense.councilId] ?: 'Không xác định'}"></td>
                        <td th:text="${#temporals.format(defense.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${defense.location}"></td>
                        <td><span class="badge bg-success" th:text="${defense.status}"></span></td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                                th:href="@{/defenses/{id}(id=${defense.id})}">Xem</a>
                            <a sec:authorize="hasAnyRole('LECTURER','DEAN','DEPARTMENT_HEAD')" class="btn btn-sm btn-outline-warning"
                                th:href="@{/defenses/{id}/edit(id=${defense.id})}">Sửa</a>
                            <form sec:authorize="hasAnyRole('LECTURER','DEAN','DEPARTMENT_HEAD')" class="d-inline" method="post" th:action="@{/defenses/{id}/delete(id=${defense.id})}"
                                onsubmit="return confirm('Bạn có chắc muốn xóa lịch bảo vệ này?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                <tr th:if="${#lists.isEmpty(defenses)}"><td colspan="8" class="text-center text-muted py-5">Chưa có lịch bảo vệ</td></tr></tbody>
            </table>

            <br>

            <a class="btn btn-outline-secondary mt-3" href="/councils">
                Quay lại hội đồng
            </a>

        </div>
    </main>
</body>

</html>
