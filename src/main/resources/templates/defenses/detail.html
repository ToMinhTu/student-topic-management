<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Chi tiết lịch bảo vệ</title></head>
<body>
<div layout:fragment="content" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2><i class="bi bi-calendar2-event me-2"></i>Chi tiết lịch bảo vệ</h2><p class="text-muted mb-0">Chủ tịch kết thúc buổi bảo vệ trước khi xác nhận điểm.</p></div><a th:href="@{/defenses}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between"><strong>Lịch bảo vệ #<span th:text="${defense.id}"></span></strong><span class="badge bg-light text-primary" th:text="${defense.status}"></span></div>
        <div class="card-body p-4"><div class="row g-4">
            <div class="col-md-6"><div class="text-muted small">Mã hồ sơ</div><div class="fs-5 fw-semibold" th:text="${defense.registrationId}"></div></div>
            <div class="col-md-6"><div class="text-muted small">Mã đợt</div><div class="fs-5 fw-semibold" th:text="${defense.roundId}"></div></div>
            <div class="col-md-6"><div class="text-muted small">Mã hội đồng</div><div class="fs-5 fw-semibold" th:text="${defense.councilId}"></div></div>
            <div class="col-md-6"><div class="text-muted small">Thời gian bảo vệ</div><div class="fs-5 fw-semibold" th:text="${#temporals.format(defense.scheduledAt, 'dd/MM/yyyy HH:mm')}"></div></div>
            <div class="col-md-6"><div class="text-muted small">Địa điểm</div><div class="fs-5 fw-semibold" th:text="${defense.location}"></div></div>
        </div>
        <div th:if="${canComplete}" class="mt-4 pt-3 border-top text-end"><form th:action="@{/defenses/{id}/complete(id=${defense.id})}" method="post" onsubmit="return confirm('Xác nhận buổi bảo vệ đã kết thúc?')"><button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Kết thúc buổi bảo vệ</button></form></div>
        <div th:if="${defense.status == 'DONE'}" class="mt-4 pt-3 border-top text-end"><a th:href="@{/results/new}" class="btn btn-primary"><i class="bi bi-calculator me-1"></i>Đi đến xác nhận kết quả</a></div>
        </div>
    </div>
</div>
</body>
</html>
