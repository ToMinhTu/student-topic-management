<!-- toan-D2 - thêm chức năng quản lý lịch bảo vệ -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết lịch bảo vệ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            color: #263238;
            font-family: Arial, sans-serif
        }

        .detail-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
            border: 1px solid #e2e8f0;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }

        .detail-container h1 {
            grid-column: 1 / -1;
            color: #173b34;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .detail-container p {
            display: flex;
            flex-direction: column;
            width: auto;
            margin: 0;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            color: #64748b;
        }

        .detail-container p span {
            margin-top: 6px;
            color: #0f172a;
            font-weight: 600;
        }

        .detail-container p:nth-of-type(1) { grid-column: 1; grid-row: 2; }
        .detail-container p:nth-of-type(2) { grid-column: 1; grid-row: 3; }

        .detail-container p:nth-of-type(3) { grid-column: 2; grid-row: 2; }
        .detail-container p:nth-of-type(4) { grid-column: 2; grid-row: 3; }

        .detail-container p:nth-of-type(5),
        .detail-container p:nth-of-type(6),
        .detail-container p:nth-of-type(7) { width: 100%; }

        .detail-container p:nth-of-type(5),
        .detail-container p:nth-of-type(6),
        .detail-container p:nth-of-type(7),
        .detail-container > a { grid-column: 1 / -1; }

        @media (max-width: 700px) {
            .detail-container { grid-template-columns: 1fr; }
            .detail-container p { grid-column: 1 / -1; }
        }

        .btn-outline-primary {
            color: #173B34;
            border-color: #173B34;
        }

        .btn-primary {
            background-color: #173B34;
        }

        .btn-outline-primary:hover {
            border-color: #173B34;
            background-color: #173B34;
            color: white;
        }
    </style>
</head>

<body class="py-4">
    <main layout:fragment="content">

        <div class="detail-container">
            <h1>Chi tiết lịch bảo vệ</h1>

            <p>ID lịch bảo vệ:
                <span th:text="${defense.id}"></span>
            </p>

            <p>Mã hồ sơ:
                <span th:text="${defense.registrationId}"></span>
            </p>

            <p>Đợt đăng ký:
                <span th:text="${roundName}"></span>
            </p>

            <p>Hội đồng bảo vệ:
                <span th:text="${councilName}"></span>
            </p>

            <p>Thời gian:
                <span th:text="${defense.scheduledAt}"></span>
            </p>

            <p>Địa điểm:
                <span th:text="${defense.location}"></span>
            </p>

            <p>Trạng thái:
                <span th:text="${defense.status}"></span>
            </p>

            <a href="/defenses">Quay lại danh sách</a>

        </div>
    </main>
</body>

</html>
