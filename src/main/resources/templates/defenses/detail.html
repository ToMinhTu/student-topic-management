<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><head><title>Chi tiết lịch bảo vệ</title></head><body>
<div layout:fragment="content" class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2><i class="bi bi-calendar2-event me-2"></i>Chi tiết lịch bảo vệ</h2><p class="text-muted mb-0">Thông tin lịch và hồ sơ tham gia bảo vệ</p></div><a th:href="@{/defenses}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a></div>
<div class="card border-0 shadow-sm"><div class="card-header bg-primary text-white d-flex justify-content-between"><strong>Lịch bảo vệ #<span th:text="${defense.id}"></span></strong><span class="badge bg-light text-primary" th:text="${defense.status}"></span></div><div class="card-body p-4"><div class="row g-4"><div class="col-md-6"><div class="text-muted small">Mã hồ sơ</div><div class="fs-5 fw-semibold" th:text="${defense.registrationId}"></div></div><div class="col-md-6"><div class="text-muted small">Mã đợt</div><div class="fs-5 fw-semibold" th:text="${defense.roundId}"></div></div><div class="col-md-6"><div class="text-muted small">Mã hội đồng</div><div class="fs-5 fw-semibold" th:text="${defense.councilId}"></div></div><div class="col-md-6"><div class="text-muted small">Thời gian bảo vệ</div><div class="fs-5 fw-semibold" th:text="${#temporals.format(defense.scheduledAt, 'dd/MM/yyyy HH:mm')}"></div></div><div class="col-md-6"><div class="text-muted small">Địa điểm</div><div class="fs-5 fw-semibold" th:text="${defense.location}"></div></div></div></div></div><div class="alert alert-info mt-4"><i class="bi bi-info-circle me-2"></i>Danh sách sinh viên và phân công giảng viên được liên kết theo hồ sơ đăng ký của nhóm.</div></div></body></html>
