<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Soạn Bản Nháp</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <h2>Soạn thảo Bản Nháp</h2>
        <form th:action="@{/management/announcements}" th:object="${form}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Tiêu đề</label>
                <input type="text" th:field="*{title}" class="form-control">
                <div class="text-danger" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nội dung</label>
                <textarea th:field="*{content}" class="form-control" rows="5"></textarea>
                <div class="text-danger" th:errors="*{content}"></div>
            </div>
            <button type="submit" class="btn btn-primary">Lưu nháp</button>
            <a th:href="@{/management/announcements}" class="btn btn-secondary">Quay lại</a>
        </form>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
