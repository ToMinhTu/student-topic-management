<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title th:text="${form.id == null ? 'Soạn Thông Báo' : 'Sửa Bản Nháp'}"></title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="card shadow-sm mx-auto" style="max-width: 800px;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${form.id == null ? 'Soạn Bản Nháp' : 'Chỉnh sửa Bản Nháp'}"></h4>
            </div>
            <div class="card-body">
                <form th:action="@{/management/announcements/save}" th:object="${form}" method="post">
                    <!-- Phuc vu cho viec sua thay vi them moi -->
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tiêu đề (*)</label>
                        <input type="text" th:field="*{title}" class="form-control"
                            th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nội dung (*)</label>
                        <textarea th:field="*{content}" class="form-control" rows="8"
                            th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"></textarea>
                        <div class="invalid-feedback" th:errors="*{content}"></div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/management/announcements}" class="btn btn-secondary">Quay lại</a>
                        <button type="submit" class="btn btn-success">Lưu bản nháp</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
