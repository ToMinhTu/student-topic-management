<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Thêm mới Sinh viên</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="card shadow-sm" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Tạo tài khoản Sinh Viên</h4>
            </div>

            <div class="card-body">
                <!-- Thong bao thanh cong -->
                <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

                <form th:action="@{/admin/students}" th:object="${form}" method="post">
                    <!-- Bao loi nghiep vu -->
                    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                    </div>
                    <div class="row">
                        <!-- Left col -->
                        <div class="col-md-6 border-end">
                            <h5 class="text-secondary">Thông tin tài khoản</h5>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên đăng nhập (*)</label>
                                <input type="text" class="form-control" th:field="*{username}">
                                <div class="text-danger small mt-1" th:errors="*{username}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu (*)</label>
                                <input type="password" class="form-control" th:field="*{password}">
                                <div class="text-danger small mt-1" th:errors="*{password}"></div>
                                <div class="form-text">Tối thiểu 12 ký tự</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Email (*)</label>
                                <input type="email" class="form-control" th:field="*{email}">
                                <div class="text-danger small mt-1" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <!-- Right col -->
                        <div class="col-md-6">
                            <h5 class="text-secondary">Hồ sơ học vụ</h5>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ và tên (*)</label>
                                <input type="text" class="form-control" th:field="*{fullname}">
                                <div class="text-danger small mt-1" th:errors="*{fullname}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mã số sinh viên (*)</label>
                                <input type="text" class="form-control" th:field="*{studentCode}">
                                <div class="text-danger small mt-1" th:errors="*{studentCode}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Bộ môn quản lý (*)</label>
                                <select class="form-select" th:field="*{departmentId}">
                                    <option value="">-- Chọn bộ môn --</option>
                                    <option th:each="dept : ${departments}" th:value="${dept.id}"
                                        th:text="${dept.name}"></option>
                                </select>
                                <div class="text-danger small mt-1" th:errors="*{departmentId}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Lớp (Tuỳ chọn)</label>
                                <input type="text" class="form-control" th:field="*{className}">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between text-end mt-4">
                        <a th:href="@{/admin/users}" class="btn btn-secondary">Quay lại danh sách</a>
                        <button type="submit" class="btn btn-success px-4">Tạo sinh viên</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <script></script>
    </th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
