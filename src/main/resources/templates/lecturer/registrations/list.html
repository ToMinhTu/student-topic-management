<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><meta charset="UTF-8"><title>Duyệt đăng ký nhóm</title></head>
<body><main layout:fragment="content" class="container-fluid px-3 px-lg-4 py-4">
<h2 class="mb-4">Duyệt đăng ký đề tài của nhóm</h2>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="card p-3 mb-4"><form method="get" th:action="@{/lecturer/registrations}" class="row g-3 align-items-end"><div class="col-md-5"><label class="form-label">Đợt đăng ký</label><select name="roundId" class="form-select"><option value="">Tất cả đợt</option><option th:each="round:${rounds}" th:value="${round.id}" th:text="${round.name}" th:selected="${selectedRoundId == round.id}"></option></select></div><div class="col-md-4"><label class="form-label">Trạng thái</label><select name="status" class="form-select"><option value="">Tất cả</option><option value="PENDING">Chờ duyệt</option><option value="APPROVED">Đã duyệt</option><option value="REJECTED">Từ chối</option></select></div><div class="col-md-3"><button class="btn btn-primary w-100">Lọc danh sách</button></div></form></div>
<div class="card p-3"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Mã hồ sơ</th><th>Nhóm</th><th>Đề tài</th><th>Đợt</th><th>Ngày gửi</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="r:${registrations}"><td th:text="${r.id}"></td><td th:text="${r.groupName}"></td><td><b th:text="${r.topicCode}"></b><div th:text="${r.topicTitle}"></div></td><td th:text="${r.roundName}"></td><td th:text="${#temporals.format(r.submittedAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.status}"></td><td><form th:if="${r.status == 'PENDING'}" th:action="@{/lecturer/registrations/{id}/approve(id=${r.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-success">Duyệt</button></form><form th:if="${r.status == 'PENDING'}" th:action="@{/lecturer/registrations/{id}/reject(id=${r.id})}" method="post" class="d-inline"><input type="hidden" name="reason" value="Hồ sơ chưa đạt yêu cầu"><button class="btn btn-sm btn-outline-danger">Từ chối</button></form></td></tr><tr th:if="${#lists.isEmpty(registrations)}"><td colspan="7" class="text-center">Không có hồ sơ.</td></tr></tbody></table></div></div>
</main></body></html>
