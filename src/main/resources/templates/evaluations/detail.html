<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Chi tiết phiếu chấm</title></head>
<body>
<div layout:fragment="content" class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4"><div><h2><i class="bi bi-file-earmark-check me-2"></i>Chi tiết phiếu chấm</h2><p class="text-muted mb-0">Thông tin đánh giá của giảng viên</p></div><a th:href="@{/evaluations}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a></div>
  <div class="card border-0 shadow-sm"><div class="card-header bg-primary text-white d-flex justify-content-between align-items-center"><strong>Phiếu chấm #<span th:text="${evaluation.id}"></span></strong><span class="badge bg-light text-primary">ĐÃ NỘP</span></div><div class="card-body p-4">
    <div class="row g-4"><div class="col-md-6"><div class="text-muted small">Mã phiếu chấm</div><div class="fs-5 fw-semibold" th:text="${evaluation.id}"></div></div><div class="col-md-6"><div class="text-muted small">Mã phân công</div><div class="fs-5 fw-semibold" th:text="${evaluation.assignmentId}"></div></div><div class="col-md-6"><div class="text-muted small">Điểm đánh giá</div><div class="display-6 fw-bold text-primary"><span th:text="${evaluation.score}"></span><small class="fs-6 text-muted"> / 10</small></div></div><div class="col-md-6"><div class="text-muted small">Thời gian nộp</div><div class="fs-5" th:text="${#temporals.format(evaluation.submittedAt, 'dd/MM/yyyy HH:mm')}"></div></div></div>
    <hr class="my-4"><div><h5><i class="bi bi-chat-left-text me-2"></i>Nhận xét</h5><div class="bg-light rounded p-3" th:if="${evaluation.comments != null and !#strings.isEmpty(evaluation.comments)}" th:text="${evaluation.comments}"></div><div class="text-muted fst-italic" th:if="${evaluation.comments == null or #strings.isEmpty(evaluation.comments)}">Không có nhận xét.</div></div>
  </div></div>
</div>
</body></html>
