<!-- toan-D3 - thêm chức năng nhập điểm -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết phiếu chấm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <h1>Chi tiết phiếu chấm</h1>

    <p>
        ID phiếu chấm:
        <span th:text="${evaluation.id}"></span>
    </p>

    <p>
        Mã phân công:
        <span th:text="${evaluation.assignmentId}"></span>
    </p>

    <p>
        Điểm:
        <span th:text="${evaluation.score}"></span>
    </p>

    <p>
        Nhận xét:
        <span th:text="${evaluation.comments}"></span>
    </p>

    <p>
        Thời gian nộp:
        <span th:text="${evaluation.submittedAt}"></span>
    </p>

    <a href="/evaluations">
        Quay lại danh sách
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
