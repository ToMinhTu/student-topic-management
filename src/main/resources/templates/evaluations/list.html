<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh sách phiếu chấm</title>
</head>

<body>

<h1>Danh sách phiếu chấm</h1>

<a href="/evaluations/new">
    Nhập điểm mới
</a>

<br><br>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Mã phân công</th>
            <th>Điểm</th>
            <th>Nhận xét</th>
            <th>Thời gian nộp</th>
            <th>Thao tác</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="evaluation : ${evaluations}">
            <td th:text="${evaluation.id}"></td>
            <td th:text="${evaluation.assignmentId}"></td>
            <td th:text="${evaluation.score}"></td>
            <td th:text="${evaluation.comments}"></td>
            <td th:text="${evaluation.submittedAt}"></td>
            <td>
                <a th:href="@{/evaluations/{id}(id=${evaluation.id})}">
                    Xem chi tiết
                </a>
            </td>
        </tr>
    </tbody>
</table>

<br>

<a href="/defenses">
    Quay lại lịch bảo vệ
</a>

</body>
</html>
