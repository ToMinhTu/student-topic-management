<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Phiếu chấm điểm</title></head><body>
<div layout:fragment="content" class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2><i class="bi bi-clipboard2-check me-2"></i>Phiếu chấm điểm</h2><p class="text-muted mb-0">Các phân công được tạo từ lịch bảo vệ D2</p></div></div>
<div class="card border-0 shadow-sm mb-4"><div class="card-header bg-white"><strong>Phân công chưa chấm của tôi</strong></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Mã phân công</th><th>Mã hồ sơ bảo vệ</th><th>Loại phân công</th><th>Giảng viên</th><th>Thao tác</th></tr></thead><tbody><tr th:each="a : ${assignments}"><td th:text="${a.id}"></td><td th:text="${a.registrationId}"></td><td><span class="badge text-bg-info" th:text="${a.assignmentType}"></span></td><td th:text="${a.lecturerId}"></td><td><a th:href="@{/evaluations/new(assignmentId=${a.id})}" class="btn btn-sm btn-primary">Nhập điểm</a></td></tr><tr th:if="${#lists.isEmpty(assignments)}"><td colspan="5" class="text-center text-muted py-4">Không còn phân công nào chưa chấm</td></tr></tbody></table></div></div>
<div class="card border-0 shadow-sm"><div class="card-header bg-white"><strong>Phiếu đã nhập</strong></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Mã phân công</th><th>Điểm</th><th>Nhận xét</th><th>Thời gian</th><th></th></tr></thead><tbody><tr th:each="evaluation : ${evaluations}"><td th:text="${evaluation.id}"></td><td th:text="${evaluation.assignmentId}"></td><td><strong th:text="${evaluation.score}"></strong></td><td th:text="${evaluation.comments}"></td><td th:text="${evaluation.submittedAt}"></td><td><a th:href="@{/evaluations/{id}(id=${evaluation.id})}" class="btn btn-sm btn-outline-primary">Chi tiết</a></td></tr><tr th:if="${#lists.isEmpty(evaluations)}"><td colspan="6" class="text-center text-muted py-4">Chưa có phiếu chấm</td></tr></tbody></table></div></div></div></body></html>
