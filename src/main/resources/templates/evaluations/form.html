<!-- toan-D3 - thêm chức năng nhập điểm -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhập điểm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <h1>Nhập phiếu chấm</h1>

    <form th:action="@{/evaluations/save}" th:object="${evaluationForm}" method="post">

        <label>Mã phân công:</label>
        <input type="number" th:field="*{assignmentId}">

        <p th:if="${#fields.hasErrors('assignmentId')}" th:errors="*{assignmentId}">
        </p>

        <br>

        <label>Điểm:</label>
        <input type="number" step="0.01" min="0" max="10" th:field="*{score}">

        <p th:if="${#fields.hasErrors('score')}" th:errors="*{score}">
        </p>

        <br>

        <label>Nhận xét:</label>
        <textarea th:field="*{comments}" rows="5" cols="40">
    </textarea>

        <p th:if="${#fields.hasErrors('comments')}" th:errors="*{comments}">
        </p>

        <br><br>

        <button type="submit">
            Lưu phiếu chấm
        </button>
    </form>

    <br>

    <a href="/evaluations">
        Quay lại danh sách
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
