<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Đổi mật khẩu</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style>

        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Đổi mật khẩu</h5>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/account/password}" th:object="${form}" method="post">
                            <!-- Hien thi loi -->
                            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                                <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mật khẩu hiện tại</label>
                                <input type="password" th:field="*{currentPassword}" class="form-control">
                                <div class="text-danger small mt-1" th:errors="*{currentPassword}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mật khẩu mới</label>
                                <input type="password" th:field="*{newPassword}" class="form-control">
                                <div class="text-danger small mt-1" th:errors="*{newPassword}"></div>
                                <div class="form-text">Tối thiểu 12 ký tự</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Xác nhận mật khẩu mới</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control">
                                <div class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Lưu mật khẩu mới</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
