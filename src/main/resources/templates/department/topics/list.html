<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Sơ duyệt đề tài bộ môn</title><th:block layout:fragment="css"><link rel="stylesheet" th:href="@{/css/part-b.css}"></th:block>
</head>
<body>
<main layout:fragment="content" class="part-b-page">
    <div class="b-page-heading"><h1 class="page-title-tab mb-0">Đề tài chờ sơ duyệt của bộ môn</h1></div>
    <p>Chỉ hiển thị đề tài đã gửi và chưa có quyết định sơ duyệt của bộ môn bạn.</p>
    <div th:if="${topics.empty}" class="alert alert-info">Không có đề tài chờ sơ duyệt trong trang này.</div>
    <div th:unless="${topics.empty}" class="table-responsive">
        <div class="b-table-scroll"><table class="table table-bordered">
            <thead><tr><th scope="col">Mã đề tài</th><th scope="col">Tên đề tài</th>
                <th scope="col">ID đợt</th><th scope="col">Thao tác</th></tr></thead>
            <tbody><tr th:each="topic : ${topics.content}">
                <td th:text="${topic.code}"></td><td th:text="${topic.title}"></td>
                <td th:text="${topic.roundId}"></td>
                <td><a th:href="@{/department/topics/{id}(id=${topic.id})}">Xem và sơ duyệt</a></td>
            </tr></tbody>
        </table></div>
    </div>
    <nav aria-label="Phân trang sơ duyệt" class="d-flex gap-3 align-items-center">
        <a th:if="${topics.hasPrevious()}" th:href="@{/department/topics(page=${topics.number - 1})}">Trang trước</a>
        <span th:if="${topics.totalPages > 0}" th:text="${'Trang ' + (topics.number + 1) + '/' + topics.totalPages}"></span>
        <a th:if="${topics.hasNext()}" th:href="@{/department/topics(page=${topics.number + 1})}">Trang sau</a>
    </nav>
</main>
</body></html>
