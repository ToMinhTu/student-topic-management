<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Thông Báo</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style>
            /* hover */
            .table-hover tbody tr {
                transition: background-color 0.2s;
                cursor: pointer;
            }

            /* format tab */
            .nav-tabs .nav-link {
                border: none;
                border-bottom: 2px solid transparent;
                color: #6c757d;
                font-weight: 500;
            }

            .nav-tabs .nav-link.active {
                color: var(--theme-color) !important;
                border-bottom: 3px solid var(--theme-color) !important;
                background: transparent;
            }

            .nav-tabs .nav-link:hover {
                border-bottom: 2px solid #dee2e6;
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <div class="page-title-tab mb-0">THÔNG BÁO</div>
            <a th:href="@{/}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Về Trang
                chủ</a>
        </div>

        <div class="content-card">
            <!-- navigation tab -->
            <ul class="nav nav-tabs mb-4 border-bottom">
                <li class="nav-item">
                    <a href="#" class="nav-link active">THÔNG BÁO CHUNG</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">THÔNG BÁO CÁ NHÂN</a>
                </li>
            </ul>

            <!-- Tim kiem -->
            <div class="mb-4">
                <div class="input-group shadow-sm" style="max-width: 500px;">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" placeholder="Tìm kiếm thông báo...">
                </div>
            </div>

            <!-- alert -->
            <div class="alert alert-info text-center py-4" th:if="${#lists.isEmpty(announcements)}">
                <i class="bi bi-info-circle me-2"></i> Hiện tại chưa có thông báo mới nào được công bố
            </div>

            <div th:if="${!#lists.isEmpty(announcements)}" class="table-responsive">
                <table class="table table-hover align-middle border mb-0">
                    <thead class="bg-theme">
                        <tr>
                            <th class="bg-theme py-3 px-3" style="width: 60%;">Tiêu đề</th>
                            <th class="bg-theme py-3" style="width: 20%;">Người gửi</th>
                            <th class="bg-theme py-3" style="width: 20%;">Thời gian gửi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ann : ${announcements}"
                            th:onclick="|window.location.href='@{/announcements/{id}(id=${ann.id})}'|">
                            <td class="px-3"><a th:href="@{announcements/{id}(id=${ann.id})}"
                                    class="text-decoration-none text-theme fw-bold" th:text="${ann.title}"></a></td>
                            <td class="text-muted small" th:text="${ann.author.fullname}"></td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(ann.publishedAt, 'dd/MM/yyyy HH:mm')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
