<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Danh sách Thông Báo</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style>

        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Thông báo chính thức</h2>
            <a th:href="@{/}" class="btn btn-outline-secondary">Quay lại Trang chủ</a>
        </div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-info text-center py-4" th:if="${#lists.isEmpty(announcements)}">
            Hiện tại chưa có thông báo mới nào được công bố
        </div>

        <div th:if="${!#lists.isEmpty(announcements)}" class="list-group shadow-sm">
            <a th:each="ann : ${announcements}" th:href="@{/announcements/{id}(id=${ann.id})}"
                class="list-group-item list-group-item-action p-3">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1 fw-bold text-primary" th:text="${ann.title}"></h5>
                    <small class="text-muted"
                        th:text="${#temporals.format(ann.publishedAt, 'dd/MM/yyyy HH:mm')}"></small>
                </div>
                <p class="mb-1 text-muted">Đăng bởi: <span th:text="${ann.author.fullname}"></span></p>
            </a>
        </div>

    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
