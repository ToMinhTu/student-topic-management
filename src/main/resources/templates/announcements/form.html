<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${form.id == null ? 'Tạo thông báo mới' : 'Sửa thông báo'}">Tạo thông báo</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h1 class="page-title-tab mb-0"
                th:text="${form.id == null ? 'TẠO THÔNG BÁO MỚI' : 'SỬA THÔNG BÁO (BẢN NHÁP)'}">TẠO THÔNG BÁO</h1>
            <a th:href="@{/management/announcements}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Quay lại
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="content-card p-4">
                    <!-- Doi url tuy thuoc vao them hay sua -->
                    <form
                        th:action="@{${form.id == null ? '/management/announcements/new' : '/management/announcements/' + form.id + '/edit'}}"
                        method="post" th:object="${form}">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="mb-4">
                            <label for="title" class="form-label fw-bold">Tiêu đề thông báo <span
                                    class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" id="title" th:field="*{title}"
                                th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                placeholder="Nhập tiêu đề (tối đa 255 ký tự)">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label fw-bold">Nội dung <span
                                    class="text-danger">*</span></label>
                            <textarea class="form-control" id="content" th:field="*{content}" rows="10"
                                th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"
                                placeholder="Nhập nội dung chi tiết..."></textarea>
                            <div class="invalid-feedback" th:errors="*{content}"></div>
                        </div>

                        <div class="text-end border-top pt-3">
                            <button type="submit" class="btn btn-theme px-4">
                                <i class="bi bi-save me-2"></i>Lưu bản nháp
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
