<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Bảng thông báo</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style>
            .custom-hover-card {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                cursor: pointer;
            }

            .custom-hover-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="mb-4 border-bottom pb-2">
            <h1 class="page-title-tab mb-0">THÔNG BÁO TỪ KHOA / BỘ MÔN</h1>
        </div>

        <div class="row g-4">
            <div class="col-12" th:each="ann : ${announcements}">
                <div class="card content-card h-100 border-0 shadow-sm custom-hover-card"
                    th:onclick="|window.location.href='@{/announcements/{id}(id=${ann.id})}'|">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h4 class="card-title fw-bold text-theme mb-0">
                                <a th:href="@{/announcements/{id}(id=${ann.id})}" class="text-decoration-none"
                                    th:text="${ann.title}">Tiêu đề thông báo</a>
                            </h4>

                            <span class="badge bg-light text-dark border">
                                <i class="bi bi-clock me-1"></i> <span
                                    th:text="${#temporals.format(ann.publishedAt, 'dd/MM/yyyy')}">01/01/2026</span>
                            </span>
                        </div>

                        <div class="text-muted small mb-3">
                            <i class="bi bi-person-fill me-1"></i> <span th:text="${ann.author.fullname}">Tác giả</span>
                        </div>

                        <!-- Hien thi 150 ky tu dau tien cua noi dung -->
                        <p class="card-text text-secondary" style="white-space: pre-wrap;"
                            th:text="${#strings.length(ann.content) > 150 ? #strings.substring(ann.content,0,150) + '...' : ann.content}">
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(announcements)}">
                <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                <p>Hiện chưa có thông báo nào được công bố.</p>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
