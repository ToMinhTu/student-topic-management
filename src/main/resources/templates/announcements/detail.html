<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Chi Tiết Thông báo</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="mb-4">
            <a th:href="@{/announcements}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Trở về danh sách
            </a>
        </div>

        <div class="content-card p-4 p-md-5">
            <h2 class="fw-bold text-theme mb-3" th:text="${announcement.title}">Tiêu đề thông báo</h2>

            <div class="d-flex align-items-center text-muted border-bottom pb-4 mb-4">
                <div class="me-4">
                    <i class="bi bi-person-circle me-2"></i>
                    Người đăng: <strong th:text="${announcement.author.fullname}">Tên tác giả</strong>
                </div>

                <div>
                    <i class="bi bi-calendar3 me-2"></i>
                    Ngày công bố: <strong
                        th:text="${#temporals.format(announcement.publishedAt, 'dd/MM/yyyy HH:mm')}">Thời gian</strong>
                </div>
            </div>

            <!-- "th:text + white-space: pre-wrap" giu xuong dong, chong XSS -->
            <div class="fs-6 lh-lg text-dark" style="white-space: pre-wrap;" th:text="${announcement.content}">
                Nội dung thông báo
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
