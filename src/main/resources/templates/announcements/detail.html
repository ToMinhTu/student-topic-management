<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Chi tiết Thông báo</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0" th:text="${announcement.title}">Tiêu đề</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">Đăng bởi: <strong th:text="${announcement.author.fullname}"></strong> vào lúc
                    <span th:text="${announcement.publishedAt}"></span></p>
                <hr>
                <p style="white-space: pre-wrap;" th:text="${announcement.content}"></p>
            </div>
        </div>
        <a th:href="@{/announcements}" class="btn btn-secondary mt-3">Quay lại danh sách</a>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
