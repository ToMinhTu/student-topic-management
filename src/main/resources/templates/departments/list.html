<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Danh Sách Bộ Môn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <div class="page-title-tab mb-0">Quản lý bộ môn</div>

            <a th:href="@{/admin/departments/new}" class="btn btn-theme btn-sm fw-bold px-3"><i
                    class="bi bi-plus-circle me-2"></i> Thêm bộ môn mới</a>
        </div>
        <div class="content-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle border mb-0">
                    <thead class="bg-theme">
                        <tr>
                            <th class="bg-theme text-white py-3 px-3" style="width: 80px;">ID</th>
                            <th class="bg-theme text-white py-3">Tên bộ môn</th>
                            <th class="bg-theme text-white py-3">Mô tả</th>
                            <th class="bg-theme text-white py-3  text-center" style="width: 120px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- danh sach trong -->
                        <tr th:if="${#lists.isEmpty(departments)}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-4 d-block mb-2"></i>Chưa có dữ liệu bộ môn
                            </td>
                        </tr>
                        <!-- Danh sach lap -->
                        <tr th:each="dept : ${departments}">
                            <td class="text-muted px-3" th:text="${dept.id}"></td>
                            <td class="text-theme fw-bold" th:text="${dept.name}"></td>
                            <td class="text-muted small" th:text="${dept.description}"></td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-1">
                                    <!-- Sua -->
                                    <a th:href="@{/admin/departments/{id}/edit(id=${dept.id})}"
                                        class="btn btn-sm btn-outline-primary" title="Sửa"><i
                                            class="bi bi-pencil-square"></i></a>
                                    <!-- Xoa -->
                                    <form th:action="@{/admin/departments/{id}/delete(id=${dept.id})}" method="post">
                                        <button type="button" class="btn btn-sm btn-outline-danger" title="Xoá"
                                            th:data-msg="|Bạn có chắc chắn muốn xoá bộ môn [${dept.name}] này không?|"
                                            onclick="window.confirmDelete(this.closest('form'), this.getAttribute('data-msg'))">
                                            <i class="bi bi-trash"></i></button>
                                    </form>
                                    <!-- <form th:action="@{/admin/departments/{id}/delete(id=${dept.id})}" method="post"
                                        th:data-msg="|Bạn có chắc chắn muốn xoá bộ môn [${dept.name}] này không?|"
                                        onsubmit="event.preventDefault(); window.confirmDelete(this, this.getAttribute('data-msg'));"
                                        >
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xoá"><i
                                                class="bi bi-trash"></i></button>
                                    </form> -->
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Neu co ma js rieng thi bo vao day -->
    <th:block layout:fragment="js">
        <script>
            // console.log("test")
        </script>
    </th:block>
</body>

</html>
