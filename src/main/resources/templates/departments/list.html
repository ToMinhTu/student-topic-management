<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Danh Sách Bộ Môn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-4">Quản lý bộ môn</h2>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <a th:href="@{/admin/departments/new}" class="btn btn-primary mb-3">+ Thêm bộ môn mới</a>
        </div>
        <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th>Tên bộ môn</th>
                    <th>Mô tả</th>
                    <th style="width: 150px;" class="text-center">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept : ${departments}">
                    <td th:text="${dept.id}"></td>
                    <td th:text="${dept.name}" class="fw-bold"></td>
                    <td th:text="${dept.description}"></td>
                    <td class="text-center">
                        <!-- Sua -->
                        <a th:href="@{/admin/departments/{id}/edit(id=${dept.id})}"
                            class="btn btn-sm btn-warning" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                        <!-- Xoa -->
                        <form th:action="@{/admin/departments/{id}/delete(id=${dept.id})}" method="post"
                            onsubmit="return confirm('Bạn có chắc chắn muốn xoá bộ môn này?');">
                            <button type="submit" class="btn btn-sm btn-danger" title="Xoá"><i class="bi bi-x"></i></button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Neu co ma js rieng thi bo vao day -->
    <th:block layout:fragment="js">
        <script>
            // console.log("test")
        </script>
    </th:block>
</body>

</html>
