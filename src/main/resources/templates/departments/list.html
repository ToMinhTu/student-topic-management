<!DOCTYPE html>
<html lang="vi"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
<head>
    <title>Danh Sách Bộ Môn</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Quản lý bộ môn</h2>
            <button class="btn btn-primary">Thêm mới</button>
        </div>

        <table class="table table-bordered table-striped bg-white mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên bộ môn</th>
                    <th>Mô tả</th>
                    <th>Ngày tạo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept : ${departments}">
                    <td th:text="${dept.id}">1</td>
                    <td th:text="${dept.name}">Công nghệ phần mềm</td>
                    <td th:text="${dept.description}">Mô tả...</td>
                    <td th:text="${dept.createdAt}">2026-10-06</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Neu co ma js rieng thi bo vao day -->
    <th:block layout:fragment="js">
        <script>
            // console.log("test")
        </script>
    </th:block>
</body>
</html>
