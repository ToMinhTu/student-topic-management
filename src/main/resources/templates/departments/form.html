<!DOCTYPE html>
<html lang="vi"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
<head>
    <title>Thêm mới bộ môn</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Thêm mới/Cập nhật bộ môn</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/departments/save}" th:object="${departmentDTO}" method="post">
                    <!-- ID an phuc vu cho viec update -->
                    <input type="hidden" th:field="*{id}">
                    <div class="mb3">
                        <label class="form-label fw-bold">Tên Bộ Môn (*)</label>
                        <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Nhập tên bộ môn">
                        <!-- Hien thi loi -->
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Nhập tên bộ môn"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/departments}" class="btn btn-secondary">Quay lại</a>
                        <button type="submit" class="btn btn-success">Lưu bộ môn</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Neu co ma js rieng thi bo vao day -->
    <th:block layout:fragment="js">
        <script>
            // console.log("test")
        </script>
    </th:block>
</body>
</html>
