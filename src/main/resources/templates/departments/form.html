<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title th:text="${form.id == null ? 'Thêm mới Bộ Môn' : 'Chỉnh sửa Bộ Môn'}">Form Bộ Môn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <div class="page-title-tab mb-0" th:text="${form.id == null ? 'THÊM MỚI BỘ MÔN' : 'CẬP NHẬT BỘ MÔN'}"></div>
            <a th:href="@{/admin/departments}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Về danh sách
            </a>
        </div>
        <div class="content-card mx-auto" style="max-width: 800px;">
            <form th:action="@{/admin/departments/save}" th:object="${form}" method="post">
                <!-- ID an phuc vu cho viec sua thay vi them moi -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-4">
                    <label class="form-label fw-bold text-theme">Tên Bộ Môn <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" th:field="*{name}"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                        placeholder="Nhập tên bộ môn...">
                    <!-- Hien thi loi -->
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-theme">Mô tả</label>
                    <textarea class="form-control" th:field="*{description}" rows="4"
                        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                        placeholder="Nhập mô tả về bộ môn (không bắt buộc)..."></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <!-- Nut bam -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a th:href="@{/admin/departments}" class="btn btn-light border px-4">Huỷ</a>
                    <button type="submit" class="btn btn-theme px-4">
                        <i class="bi bi-floppy me-2"></i>Lưu dữ liệu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Neu co ma js rieng thi bo vao day -->
    <th:block layout:fragment="js">
        <script>
            // console.log("test")
        </script>
    </th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
