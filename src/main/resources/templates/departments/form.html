<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${form.id == null ? 'Thêm mới Bộ Môn' : 'Chỉnh sửa Bộ Môn'}">Form Bộ Môn</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${form.id == null ? 'Thêm mới Bộ Môn' : 'Cập nhật Bộ Môn'}"></h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/departments/save}" th:object="${form}" method="post">
                    <!-- ID an phuc vu cho viec sua thay vi them moi -->
                    <input type="hidden" th:field="*{id}">

                    <div class="mb3">
                        <label class="form-label fw-bold">Tên Bộ Môn (*)</label>
                        <input type="text" class="form-control" th:field="*{name}"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <!-- Hien thi loi -->
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="mb3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea class="form-control" th:field="*{description}" rows="4"
                            th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/admin/departments}" class="btn btn-secondary">Quay lại danh sách</a>
                        <button type="submit" class="btn btn-success">Lưu dữ liệu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Neu co ma js rieng thi bo vao day -->
    <th:block layout:fragment="js">
        <script>
            // console.log("test")
        </script>
    </th:block>
</body>

</html>
