<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:with="bodyClass='d-flex align-items-center vh-100'">

<head>
    <title>Đăng nhập</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style>
            nav.navbar {
                display: none !important;
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Đăng Nhập</h3>

                        <!-- Hien thi loi -->
                        <div class="alert alert-danger" th:if="${param.error}">
                            Thông tin đăng nhập không hợp lệ
                        </div>
                        <div class="alert alert-success" th:if="${param.logout}">
                            Bạn đã đăng xuất thành công
                        </div>
                        <div class="alert alert-success" th:if="${param.passwordChanged}">
                            Đổi mật khẩu thành công
                        </div>
                        <div class="alert alert-warning" th:if="${param.expired}">
                            Phiên đăng nhập đã hết hạn hoặc tài khoản vừa được đổi mật khẩu. Vui lòng đăng nhập lại.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <!-- Vuot qua loi CSRF 403 -->
                            <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->
                            <div class="mb-3">
                                <label class="form-label">Tên đăng nhập</label>
                                <input type="text" name="username" class="form-control" required
                                    autocomplete="username">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mật khẩu</label>
                                <input type="password" name="password" class="form-control" required
                                    autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
