<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Hệ Thống Quản Lý</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/announcements}">Thông báo</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Quản trị hệ thống</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin/departments}">Bộ môn</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/users}">Người dùng</a></li>
                        <li><a class="dropdown-item" th:href="@{/management/announcements}">Quản lý thông báo</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('STUDENT','ADMIN')">
                    <a class="nav-link" th:href="@{/groups}">Nhóm sinh viên</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('DEAN')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Nghiệp vụ khoa</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/dean/rounds}">Quản lý đăng ký</a></li>
                        <li><a class="dropdown-item" th:href="@{/councils}">Hội đồng</a></li>
                        <li><a class="dropdown-item" th:href="@{/management/announcements}">Thông báo khoa</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item"><a class="nav-link" th:href="@{/account/password}">Đổi mật khẩu</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn nav-link text-danger fw-bold" type="submit">Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
