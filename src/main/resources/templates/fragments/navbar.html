<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light shadow-sm"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div class="container">
            <!-- Link logo -->
            <a th:href="@{/}" class="navbar-brand fw-bold text-primary">Hệ Thống Quản Lý</a>

            <!-- Bat/Tat menu -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <!-- Tat ca user -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a th:href="@{/announcements}" class="nav-link">Thông báo</a>
                    </li>
                    <!-- ADMIN va DEAN -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'DEAN')">
                        <a th:href="@{/management/announcements}" class="nav-link">QL Thông báo</a>
                    </li>
                    <!-- ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin/departments}" class="nav-link">Bộ Môn</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin/users}" class="nav-link">Người dùng</a>
                    </li>

                    <!-- <li class="nav-item">
                        <a th:href="@{/students}" class="nav-link">Sinh Viên</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/topics}" class="nav-link">Đề Tài</a>
                    </li> -->
                </ul>
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn nav-link text-danger fw-bold"
                                style="border: none; background: transparent;">
                                Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>

</html>
