<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light shadow-sm"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <div class="container">
            <!-- Link logo -->
            <a th:href="@{/}" class="navbar-brand fw-bold text-primary">Hệ Thống Quản Lý</a>

            <!-- Bat/Tat menu -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <!-- Tat ca user -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a th:href="@{/announcements}" class="nav-link">Thông báo</a>
                    </li>

                    <!-- ADMIN Dropdown -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Quản trị hệ thống
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="adminDropdown">
                            <li><a class="dropdown-item" th:href="@{/admin/departments}">Bộ Môn</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/users}">Người dùng</a></li>
                            <li><a class="dropdown-item" th:href="@{/management/announcements}">QL Thông báo</a></li>
                        </ul>
                    </li>

                    <!-- STUDENT va ADMIN: Quan ly nhom sinh vien -->
                    <li class="nav-item" sec:authorize="hasAnyRole('STUDENT', 'ADMIN')">
                        <a th:href="@{/groups}" class="nav-link">
                            Nhóm sinh viên
                        </a>
                    </li>

                    <!-- DEAN: Dropdown Nghiem vu khoa -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('DEAN')">
                        <a class="nav-link dropdown-toggle" href="#" id="deanDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Nghiệp vụ khoa
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="deanDropdown">
                            <li><a class="dropdown-item" th:href="@{/dean/rounds}">Quản lý đăng ký</a></li>
                            <li><a class="dropdown-item" th:href="@{/councils}">Hội đồng</a></li>
                            <li><a class="dropdown-item" th:href="@{/management/announcements}">Thông báo khoa</a></li>
                        </ul>
                    </li>

                    <!-- <li class="nav-item">
                        <a th:href="@{/students}" class="nav-link">Sinh Viên</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/topics}" class="nav-link">Đề Tài</a>
                    </li> -->
                </ul>
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a th:href="@{/account/password}" class="nav-link">Đổi mật khẩu</a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn nav-link text-danger fw-bold"
                                style="border: none; background: transparent;">
                                Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>

</html>
