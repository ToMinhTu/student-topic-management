<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Hàng đợi email</title></head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2><i class="bi bi-envelope-paper me-2"></i>Hàng đợi email</h2><p class="text-muted mb-0">Theo dõi email kết quả do D5 tạo</p></div>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>ID</th><th>Kết quả / Sinh viên</th><th>Người nhận</th><th>Tiêu đề</th><th>Trạng thái</th><th>Lần thử</th><th>Thời gian</th><th>Lỗi gần nhất</th><th class="text-end">Thao tác</th></tr></thead>
            <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${job.id}"></td>
                    <td><div th:text="${'KQ #' + job.resultId}"></div><small class="text-muted" th:text="${'SV #' + job.studentId}"></small></td>
                    <td th:text="${job.recipientEmail}"></td>
                    <td th:text="${job.subject}"></td>
                    <td>
                        <span class="badge" th:classappend="${job.status == 'SENT' ? 'text-bg-success' : job.status == 'FAILED' ? 'text-bg-danger' : job.status == 'PROCESSING' ? 'text-bg-info' : 'text-bg-warning'}" th:text="${job.status}"></span>
                    </td>
                    <td th:text="${job.attempts}"></td>
                    <td>
                        <span th:if="${job.sentAt != null}" th:text="${#temporals.format(job.sentAt, 'dd/MM/yyyy HH:mm:ss')}"></span>
                        <span th:if="${job.sentAt == null && job.nextAttemptAt != null}" th:text="${#temporals.format(job.nextAttemptAt, 'dd/MM/yyyy HH:mm:ss')}"></span>
                        <span th:if="${job.sentAt == null && job.nextAttemptAt == null}" class="text-muted">Chờ xử lý</span>
                    </td>
                    <td class="text-danger small" th:text="${job.lastError}"></td>
                    <td class="text-end">
                        <form th:if="${job.status == 'FAILED'}" th:action="@{/admin/mail-jobs/{id}/retry(id=${job.id})}" method="post" onsubmit="return confirm('Đưa email này vào hàng đợi gửi lại?')">
                            <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-arrow-clockwise me-1"></i>Thử lại</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(jobs)}"><td colspan="9" class="text-center text-muted py-5">Chưa có email nào trong hàng đợi</td></tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>
