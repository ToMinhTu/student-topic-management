
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh sách nhóm sinh viên</title>

    <style layout:fragment="css">
        .groups-page {
            width: 100%;
            max-width: none;
            padding: 20px 24px;
            margin: 0;
            box-sizing: border-box;
            color: #263238;
        }

        /* Thanh tiêu đề xanh đậm */
        .groups-page .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .groups-page .ribbon-title {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            min-width: 300px;
            padding: 8px 40px 8px 18px;
            background: #173e34;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            clip-path: polygon(
                0 0,
                100% 0,
                calc(100% - 20px) 100%,
                0 100%
            );
        }

        /* Các nút chức năng */
        .groups-page .group-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 5px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .groups-page .btn-create {
            background: #2563eb;
            color: #ffffff;
        }

        .groups-page .btn-create:hover {
            background: #1d4ed8;
            color: #ffffff;
        }

        .groups-page .btn-detail {
            background: #07805b;
            color: #ffffff;
        }

        .groups-page .btn-detail:hover {
            background: #066b4c;
            color: #ffffff;
        }

        /* Khung danh sách */
        .groups-page .group-card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.035);
        }

        .groups-page .card-heading {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 16px;
            font-weight: 700;
            color: #263238;
            margin: 0 0 16px;
        }

        .groups-page .card-heading i {
            color: #173e34;
        }

        /* Bảng dữ liệu */
        .groups-page .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .groups-page .group-table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            table-layout: auto;
            background: #ffffff;
        }

        .groups-page .group-table th,
        .groups-page .group-table td {
            border: 1px solid #e5e7eb;
            padding: 13px 14px;
            text-align: left;
            font-size: 14px;
            vertical-align: middle;
        }

        .groups-page .group-table th {
            background: #f3f4f6;
            color: #1f2937;
            font-weight: 700;
            white-space: nowrap;
        }

        .groups-page .group-table tbody tr:hover {
            background: #f8fafc;
        }

        .groups-page .group-table th:last-child,
        .groups-page .group-table td:last-child {
            text-align: center;
        }

        .groups-page .group-name {
            font-weight: 600;
            color: #1f2937;
        }

        /* Trạng thái */
        .groups-page .group-status {
            display: inline-flex;
            align-items: center;
            border-radius: 4px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .groups-page .status-forming {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .groups-page .status-locked {
            background: #fef08a;
            color: #854d0e;
        }

        .groups-page .status-default {
            background: #e5e7eb;
            color: #374151;
        }

        .groups-page .empty-message {
            padding: 30px 12px !important;
            text-align: center !important;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .groups-page {
                padding: 14px 12px;
            }

            .groups-page .ribbon-title {
                min-width: 0;
                font-size: 15px;
            }

            .groups-page .group-card {
                padding: 12px;
            }

            .groups-page .page-top {
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<main layout:fragment="content">

    <div class="groups-page">

        <!-- Thanh tiêu đề -->
        <div class="page-top">
            <div class="ribbon-title">
                DANH SÁCH NHÓM SINH VIÊN
            </div>

            <a class="group-btn btn-create"
               th:href="@{/groups/create}">
                <i class="bi bi-plus-circle"></i>
                Tạo nhóm mới
            </a>
        </div>

        <div class="alert alert-danger"
             role="alert"
             th:if="${error != null or errorMessage != null}"
             th:text="${error != null ? error : errorMessage}">
            Không thể xử lý yêu cầu.
        </div>

        <!-- Khung danh sách -->
        <section class="group-card">

            <h2 class="card-heading">
                <i class="bi bi-people"></i>
                Danh sách nhóm sinh viên
            </h2>

            <div class="table-wrapper">

                <table class="group-table">
                    <thead>
                    <tr>
                        <th>Mã nhóm</th>
                        <th>Tên nhóm</th>
                        <th>Đợt đăng ký</th>
                        <th>Số thành viên</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Danh sách nhóm -->
                    <tr th:each="group : ${groups}">

                        <td th:text="${group.id}">
                            1
                        </td>

                        <td>
                            <span class="group-name"
                                  th:text="${group.name}">
                                Nhóm C04 Test 01
                            </span>
                        </td>

                        <td th:text="${group.roundId}">
                            1
                        </td>

                        <td th:text="${group.memberCount}">
                            2
                        </td>

                        <td>
                            <span class="group-status"
                                  th:classappend="${group.status == 'LOCKED'} ? 'status-locked' : (${group.status == 'FORMING'} ? 'status-forming' : 'status-default')"
                                  th:text="${group.status}">
                                FORMING
                            </span>
                        </td>

                        <td>
                            <a class="group-btn btn-detail"
                               th:href="@{/groups/{id}(id=${group.id})}">
                                <i class="bi bi-eye"></i>
                                Xem chi tiết
                            </a>
                        </td>

                    </tr>

                    <!-- Khi chưa có nhóm -->
                    <tr th:if="${groups == null or #lists.isEmpty(groups)}">
                        <td colspan="6" class="empty-message">
                            <i class="bi bi-inbox"></i>
                            Hiện chưa có nhóm sinh viên nào.
                        </td>
                    </tr>

                    </tbody>
                </table>

            </div>
        </section>

    </div>

</main>

</body>
</html>
