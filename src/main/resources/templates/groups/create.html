
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Tạo nhóm sinh viên</title>
</head>

<body>

<div layout:fragment="content">

    <!-- TIEU DE TRANG -->
    <div class="d-flex justify-content-between align-items-center
                mb-4 border-bottom pb-2">

        <div class="page-title-tab mb-0">
            TẠO NHÓM SINH VIÊN
        </div>

        <a th:href="@{/groups}"
           class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Quay lại danh sách nhóm
        </a>

    </div>

    <!-- NOI DUNG TAO NHOM -->
    <div class="content-card">

        <div class="mx-auto" style="max-width: 650px;">

            <h4 class="text-center mb-3">
                <i class="bi bi-people me-2"></i>
                Tạo nhóm mới
            </h4>

            <p class="text-muted text-center mb-4">
                Sinh viên tạo nhóm sẽ được chỉ định làm
                trưởng nhóm (vị trí số 1).
            </p>

            <!-- THONG BAO LOI NGHIEP VU -->
            <div class="alert alert-danger"
                 role="alert"
                 th:if="${errorMessage != null}"
                 th:text="${errorMessage}">
            </div>

            <!-- FORM TAO NHOM -->
            <form th:action="@{/groups/create}"
                  th:object="${groupForm}"
                  method="post">

                <!-- CSRF -->
                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- DOT DANG KY -->
                <div class="mb-4">

                    <label for="roundId"
                           class="form-label fw-semibold">
                        Đợt đăng ký
                    </label>

                    <select id="roundId"
                            class="form-select"
                            th:field="*{roundId}"
                            th:classappend="${#fields.hasErrors('roundId')} ? 'is-invalid' : ''"
                            required>

                        <option value="">
                            -- Chọn đợt đăng ký --
                        </option>

                        <option th:each="round : ${rounds}"
                                th:value="${round.id}"
                                th:text="${round.name}">
                            Tên đợt đăng ký
                        </option>

                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('roundId')}"
                         th:errors="*{roundId}">
                    </div>

                </div>

                <!-- TEN NHOM -->
                <div class="mb-4">

                    <label for="name"
                           class="form-label fw-semibold">
                        Tên nhóm
                    </label>

                    <input type="text"
                           id="name"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           maxlength="150"
                           placeholder="Ví dụ: Nhóm đồ án 07"
                           required>

                    <div class="form-text">
                        Tên nhóm không được để trống
                        và tối đa 150 ký tự.
                    </div>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>

                </div>

                <!-- CAC NUT THAO TAC -->
                <div class="d-flex gap-3 mt-4">

                    <a th:href="@{/groups}"
                       class="btn btn-outline-secondary flex-fill">
                        <i class="bi bi-x-circle me-1"></i>
                        Hủy
                    </a>

                    <button type="submit"
                            class="btn btn-primary flex-fill">
                        <i class="bi bi-plus-circle me-1"></i>
                        Tạo nhóm
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
