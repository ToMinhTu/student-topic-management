
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tạo nhóm sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #1d4ed8;
        }

        .description {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .hint {
            margin-top: 6px;
            font-size: 13px;
            color: #64748b;
        }

        .error {
            color: #dc2626;
            margin-top: 6px;
            font-size: 13px;
        }

        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h2>Tạo nhóm sinh viên</h2>

    <p class="description">
        Sinh viên tạo nhóm sẽ được chỉ định
        làm trưởng nhóm (vị trí số 1).
    </p>

    <div th:if="${errorMessage != null}"
         class="alert"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/groups/create}"
          th:object="${groupForm}"
          method="post">

        <div class="form-group">
            <label for="roundId">
                Đợt đăng ký
            </label>

            <select id="roundId"
                    th:field="*{roundId}"
                    required>

                <option value="">
                    -- Chọn đợt đăng ký --
                </option>

                <option th:each="round : ${rounds}"
                        th:value="${round.id}"
                        th:text="${round.name}">
                </option>

            </select>

            <div class="error"
                 th:if="${#fields.hasErrors('roundId')}"
                 th:errors="*{roundId}">
            </div>
        </div>

        <div class="form-group">
            <label for="name">
                Tên nhóm
            </label>

            <input type="text"
                   id="name"
                   th:field="*{name}"
                   maxlength="150"
                   placeholder="Ví dụ: Nhóm đồ án 07"
                   required>

            <p class="hint">
                Tên nhóm không được để trống
                và tối đa 150 ký tự.
            </p>

            <div class="error"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="actions">

            <a class="btn btn-secondary"
               th:href="@{/groups}">
                Quay lại
            </a>

            <button class="btn btn-primary"
                    type="submit">
                Tạo nhóm
            </button>

        </div>

    </form>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
