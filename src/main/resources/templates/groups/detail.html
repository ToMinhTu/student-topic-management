
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chi tiết nhóm sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1d4ed8;
            margin-top: 0;
        }

        h3 {
            margin-top: 35px;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .info-item strong {
            display: block;
            margin-bottom: 5px;
            color: #475569;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #eff6ff;
        }

        .leader {
            font-weight: bold;
            color: #1d4ed8;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 18px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            color: white;
            font-size: 15px;
        }

        .btn-primary {
            background: #2563eb;
        }

        .btn-success {
            background: #15803d;
        }

        .btn-secondary {
            background: #64748b;
        }

        .alert {
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 18px;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <h2>Chi tiết nhóm sinh viên</h2>

    <div class="alert alert-success"
         th:if="${successMessage != null}"
         th:text="${successMessage}">
    </div>

    <div class="alert alert-error"
         th:if="${errorMessage != null}"
         th:text="${errorMessage}">
    </div>

    <div class="info">

        <div class="info-item">
            <strong>Mã nhóm</strong>
            <span th:text="${group.id}">1</span>
        </div>

        <div class="info-item">
            <strong>Tên nhóm</strong>
            <span th:text="${group.name}">
                Nhóm đồ án 07
            </span>
        </div>

        <div class="info-item">
            <strong>Đợt đăng ký</strong>
            <span th:text="${group.roundId}">1</span>
        </div>

        <div class="info-item">
            <strong>Trạng thái</strong>
            <span th:text="${group.status}">
                FORMING
            </span>
        </div>

        <div class="info-item">
            <strong>Số thành viên</strong>
            <span th:text="${memberCount}">
                1
            </span>
        </div>

    </div>

    <h3>Danh sách thành viên</h3>


<table>
    <thead>
        <tr>
            <th>STT</th>
            <th>Mã sinh viên</th>
            <th>Họ tên</th>
            <th>Vị trí</th>
            <th>Vai trò</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="member, stat : ${members}">
            <td th:text="${stat.count}">1</td>

            <td th:text="${member.studentCode}">
                C01DEMO001
            </td>

            <td th:text="${member.fullName}">
                Nguyen Van An
            </td>

            <td th:text="${member.slotNo}">1</td>

            <td>
                <span th:if="${member.slotNo == 1}"
                      class="leader">
                    Trưởng nhóm
                </span>

                <span th:unless="${member.slotNo == 1}">
                    Thành viên
                </span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(members)}">
            <td colspan="5" class="empty">
                Chưa có thành viên.
            </td>
        </tr>
    </tbody>
</table>


    <div class="actions">

        <a class="btn btn-secondary"
           th:href="@{/groups}">
            Quay lại
        </a>

        <!-- Chỉ hiển thị khi Controller xác nhận được phép Join -->
        <form th:if="${canJoin == true}"
              th:action="@{/groups/{id}/join(id=${group.id})}"
              method="post">

            <button type="submit"
                    class="btn btn-success">
                Tham gia nhóm
            </button>

        </form>

    </div>

</div>

</body>
</html>
