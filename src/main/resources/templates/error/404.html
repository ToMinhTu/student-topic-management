<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Không tìm thấy trang (404)</title>
    <!-- css rieng -->
    <th:block layout:fragment="css">
        <!-- link, style, etc -->
        <style></style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex flex-column align-items-center justify-content-center text-center mt-5">
            <h1 class="display-1 fw-bold text-theme mb-0">404</h1>
            <i class="bi bi-file-earmark-x text-secondary mb-3" style="font-size: 5rem;"></i>

            <h2 class="fw-bold text-dark">KHÔNG TÌM THẤY DỮ LIỆU</h2>

            <!-- Error Exception -->
            <p class="text-danger fs-5 mb-4"
                th:text="${message ?: 'Trang bạn tìm kiếm không tồn tại, đã bị xóa hoặc chưa được công bố.'}">
                Trang bạn tìm kiếm không tồn tại.
            </p>

            <div class="d-flex gap-3">
                <a th:href="@{/announcements}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-card-list me-2"></i>Xem danh sách thông báo
                </a>
                <a th:href="@{/}" class="btn btn-theme px-4 py-2">
                    <i class="bi bi-house-door me-2"></i>Về trang chủ
                </a>
            </div>
        </div>
    </div>

    <!-- Js rieng -->
    <th:block layout:fragment="js">
        <!-- src, script, etc -->
        <script></script>
    </th:block>
</body>

</html>
