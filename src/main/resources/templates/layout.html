<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tu dong lay tieu de cua trang con vao -->
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Hệ Thống</title>

    <!-- FAVICON -->
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/shield-shaded.svg"
        type="image/svg+xml">

    <!-- Bootstrap Css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS custom -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- trang con nhung them file css rieng -->
    <th:block layout:fragment="css"></th:block>
</head>

<body th:classappend="${bodyClass}">
    <!-- Loading full screen -->
    <div id="global-loader">
        <div class="spinner-border text-theme" role="status" style="width: 3rem; height: 3rem; border-width: 0.3em;">
        </div>
    </div>

    <div id="wrapper">
        <!-- sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- right content (Header + Content) -->
        <div id="page-content-wrapper">
            <!-- header -->
            <div th:replace="~{fragments/header :: header}"></div>

            <!-- Noi dung trang con -->
            <div id="main-content">
                <!-- Loading content -->
                <div id="content-loader">
                    <div class="spinner-border text-theme" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
                </div>
                <!-- Thong bao Popup -->
                <div th:replace="~{fragments/messages :: alerts}"></div>
                <!-- Noi dung chinh -->
                <main layout:fragment="content"></main>
            </div>
        </div>
    </div>

    <!-- Model xac nhan xoa -->
    <div class="modal fade" id="globalDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Xác
                        nhận xoá</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>
                <div class="modal-body text-center fs-5 text-muted py-4">
                    <!-- Noi dung chen qua js -->
                </div>
                <div class="modal-footer border-top-0 d-flex justify-content-center bg-light">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Huỷ bỏ</button>
                    <button type="button" class="btn btn-danger px-4" id="confirmDeleteBtn">Xoá dữ liệu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS dung chung -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script on/off Sidebar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const globalLoader = document.getElementById("global-loader");
            const contentLoader = document.getElementById("content-loader");

            // Tat loader
            if (globalLoader) {
                setTimeout(() => globalLoader.classList.add("hidden"), 100);
            }
            if (contentLoader) {
                setTimeout(() => contentLoader.classList.add("hidden"), 100);
            }

            // Fix bug ket loader khi nhan nut back cua trinh duyet
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    if (globalLoader) globalLoader.classList.add("hidden");
                    if (contentLoader) contentLoader.classList.add("hidden");
                }
            });

            // Bat loader khi click vao cac link sidebar
            document.querySelectorAll("#app-sidebar .nav-link").forEach(link => {
                link.addEventListener("click", function (e) {
                    const href = this.getAttribute("href");
                    const target = this.getAttribute("target");
                    // loading neu href hop le, khong phai link neo (#), javascript, tab moi
                    if (href && !href.startsWith("#") && !href.startsWith("javascript") && target !== "_blank") {
                        if (contentLoader) contentLoader.classList.remove("hidden");
                    }
                });
            });

            // Bat loader khi submit form (login, them, xoa, sua)
            document.querySelectorAll("form").forEach(form => {
                form.addEventListener("submit", function () {
                    if (this.checkValidity()) {
                        if (this.id == "loginForm" && globalLoader) {
                            globalLoader.classList.remove("hidden");
                        } else if (contentLoader) {
                            contentLoader.classList.remove("hidden");
                        }
                    }
                });
            });

            // Modal logic
            const deleteModalEl = document.getElementById('globalDeleteModal');
            if (deleteModalEl) {
                let currentFormToSubmit = null;

                // global from bat ky nut xoa nao
                window.confirmDelete = function (formElement, message) {
                    currentFormToSubmit = formElement;
                    if (message) deleteModalEl.querySelector('.modal-body').textContent = message;
                    new bootstrap.Modal(deleteModalEl).show();
                };

                // Nhan xoa
                document.getElementById('confirmDeleteBtn').addEventListener('click', function () {
                    if (currentFormToSubmit) {
                        if (contentLoader) contentLoader.classList.remove("hidden");
                        currentFormToSubmit.submit();
                    }
                });
            }

            // On/off Sidebar
            const toggleBtn = document.getElementById("sidebarToggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    document.getElementById("app-sidebar").classList.toggle("collapsed");
                });
            }

            // Tat alert popup sau 3.5s
            setTimeout(() => {
                const alerts = document.querySelectorAll('.floating-alerts .alert');
                alerts.forEach(alert => {
                    if (typeof bootstrap !== 'undefined') {
                        const bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    }
                });
            }, 3500);
        });
    </script>

    <!-- trang con nhung them file js rieng -->
    <th:block layout:fragment="js"></th:block>

</body>

</html>
