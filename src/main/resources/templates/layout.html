<!DOCTYPE html>
<html lang="vi" 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tu dong lay tieu de cua trang con vao -->
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Hệ Thống</title>

    <!-- css dung chung -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- trang con nhung them file css rieng -->
    <th:block layout:fragment="css"></th:block>
</head>
<body class="bg-light" th:classappend="${bodyClass}">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Noi dung trang con -->
    <div class="container mt-4">
        <main layout:fragment="content"></main>
    </div>

    <!-- JS dung chung -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- trang con nhung them file js rieng -->
    <th:block layout:fragment="js"></th:block>

</body>
</html>
