<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tu dong lay tieu de cua trang con vao -->
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Hệ Thống</title>

    <!-- FAVICON -->
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/shield-shaded.svg"
        type="image/svg+xml">

    <!-- Bootstrap Css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS custom -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- trang con nhung them file css rieng -->
    <th:block layout:fragment="css"></th:block>
</head>

<body th:classappend="${bodyClass}">
    <!-- Loading -->
    <div id="global-loader">
        <div class="spinner-border text-theme" role="status" style="width: 3rem; height: 3rem; border-width: 0.3em;">
            <span class="visually-hidden">Đang tải...</span>
        </div>
    </div>

    <div id="wrapper">
        <!-- sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- right content (Header + Content) -->
        <div id="page-content-wrapper">
            <!-- header -->
            <div th:replace="~{fragments/header :: header}"></div>

            <!-- Noi dung trang con -->
            <div id="main-content">
                <!-- Thong bao Popup -->
                <div th:replace="~{fragments/messages :: alerts}"></div>
                <!-- Noi dung chinh -->
                <main layout:fragment="content"></main>
            </div>
        </div>
    </div>

    <!-- JS dung chung -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script on/off Sidebar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Tat loader
            const loader = document.getElementById("global-loader");
            if (loader) {
                setTimeout(() => loader.classList.add("hidden"), 100);
            }

            // Bat loader khi click vao cac link
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function (e) {
                    const href = this.getAttribute("href");
                    const target = this.getAttribute("target");
                    // loading neu href hop le, khong phai link neo (#), javascript, tab moi
                    if (href && !href.startsWith("#") && !href.startsWith("javascript") && target !== "_blank") {
                        if (loader) loader.classList.remove("hidden");
                    }
                });
            });

            // Bat loader khi submit form (login, them, xoa, sua)
            document.querySelectorAll("form").forEach(form => {
                form.addEventListener("submit", function () {
                    if (loader) loader.classList.remove("hidden");
                });
            });

            // On/off Sidebar
            const toggleBtn = document.getElementById("sidebarToggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    document.getElementById("app-sidebar").classList.toggle("collapsed");
                });
            }

            // Tat alert popup sau 3.5s
            setTimeout(() => {
                const alerts = document.querySelectorAll('.floating-alerts .alert');
                alerts.forEach(alert => {
                    if (typeof bootstrap !== 'undefined') {
                        const bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    }
                });
            }, 3500);
        });
    </script>

    <!-- trang con nhung them file js rieng -->
    <th:block layout:fragment="js"></th:block>

</body>

</html>
