<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Danh sách hội đồng</title><style>body{margin:0;background:#f4f6f9;color:#263238;font-family:Arial,sans-serif}.container{max-width:1000px;margin:40px auto;padding:30px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08)}h1{color:#1d4ed8;margin-top:0}h2{margin-top:30px;color:#263238}.card{background:#f8fafc;border-radius:8px;padding:20px;margin:20px 0}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:13px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#eff6ff;color:#173b66}.btn{display:inline-block;padding:10px 16px;border-radius:6px;text-decoration:none;border:0;cursor:pointer;font-size:15px}.primary{background:#2563eb;color:#fff}.secondary{background:#64748b;color:#fff}.success{background:#15803d;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.form-row{margin:18px 0}.form-row label{display:block;font-weight:bold;margin-bottom:7px}.form-control,.form-select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px;box-sizing:border-box}.error{color:#b91c1c;margin-top:5px}.notice{padding:12px;background:#eff6ff;color:#1e40af;border-radius:6px;margin:15px 0}</style></head><body>

<div th:replace="~{fragments/navbar :: navbar}"></div><div class="container"><h1>Danh sách hội đồng</h1><p class="notice">Hội đồng được tạo theo từng đợt đăng ký và dùng để tổ chức bảo vệ đồ án.</p><div class="actions"><a sec:authorize="hasAnyRole('DEAN','DEPARTMENT_HEAD')" class="btn primary" href="/councils/new">+ Tạo hội đồng mới</a><a class="btn secondary" href="/dean/rounds">Quay lại đợt đăng ký</a></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Tên hội đồng</th><th>Đợt</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="council : ${councils}"><td th:text="${council.id}"></td><td th:text="${council.name}"></td><td th:text="${council.roundId}"></td><td th:text="${council.status}"></td><td><a sec:authorize="hasAnyRole('DEAN','DEPARTMENT_HEAD')" th:href="@{/councils/{id}/edit(id=${council.id})}">Sửa</a> <span> | </span><a th:href="@{/councils/{id}/members(id=${council.id})}">Thành viên</a></td></tr><tr th:if="${#lists.isEmpty(councils)}"><td colspan="5">Chưa có hội đồng.</td></tr></tbody></table></div></div></body></html>
