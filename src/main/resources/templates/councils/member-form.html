
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm thành viên hội đồng</title>

    <style layout:fragment="css">
        .member-form-page {
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            color: #263238;
        }

        .member-form-page .page-title {
            display: inline-flex;
            align-items: center;
            min-height: 46px;
            padding: 10px 45px 10px 20px;
            margin-bottom: 22px;
            background: #173e34;
            color: white;
            font-size: 18px;
            font-weight: 700;
            clip-path: polygon(
                0 0,
                100% 0,
                calc(100% - 20px) 100%,
                0 100%
            );
        }

        .member-form-page .form-card {
            width: 100%;
            background: white;
            padding: 26px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            box-sizing: border-box;
        }

        .member-form-page .card-heading {
            font-size: 18px;
            font-weight: 700;
            color: #263238;
            margin: 0 0 20px;
        }

        .member-form-page .notice {
            background: #eff6ff;
            color: #1e40af;
            border-radius: 6px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }

        .member-form-page .form-row-custom {
            margin-bottom: 22px;
        }

        .member-form-page .form-label-custom {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #334155;
        }

        .member-form-page .form-control-custom {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
            box-sizing: border-box;
        }

        .member-form-page .form-control-custom:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .member-form-page .field-error {
            margin-top: 6px;
            font-size: 13px;
            color: #b91c1c;
        }

        .member-form-page .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        .member-form-page .council-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .member-form-page .btn-save {
            background: #2563eb;
            color: white;
        }

        .member-form-page .btn-back {
            background: #64748b;
            color: white;
        }

        .member-form-page .council-btn:hover {
            filter: brightness(0.9);
            color: white;
        }

        @media (max-width: 768px) {
            .member-form-page {
                padding: 14px 12px;
            }

            .member-form-page .form-card {
                padding: 16px;
            }

            .member-form-page .page-title {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<main layout:fragment="content">

    <div class="member-form-page">

        <!-- Tiêu đề -->
        <div class="page-title">
            THÊM THÀNH VIÊN HỘI ĐỒNG
        </div>

        <!-- Biểu mẫu -->
        <section class="form-card">

            <h2 class="card-heading">
                <i class="bi bi-person-plus"></i>
                Thông tin thành viên hội đồng
            </h2>

            <div class="notice">
                Hội đồng:
                <strong th:text="${council.name}">
                    Hội đồng bảo vệ C6
                </strong>
            </div>

            <form th:action="@{/councils/{id}/members/save(id=${council.id})}"
                  th:object="${memberForm}"
                  method="post">

                <!-- Mã giảng viên -->
                <div class="form-row-custom">

                    <label for="lecturerId"
                           class="form-label-custom">
                        Mã giảng viên
                    </label>

                    <input id="lecturerId"
                           class="form-control-custom"
                           type="number"
                           min="1"
                           th:field="*{lecturerId}"
                           placeholder="Nhập mã giảng viên"
                           required>

                    <div class="field-error"
                         th:if="${#fields.hasErrors('lecturerId')}"
                         th:errors="*{lecturerId}">
                    </div>

                </div>

                <!-- Vai trò hội đồng -->
                <div class="form-row-custom">

                    <label for="slotNo"
                           class="form-label-custom">
                        Vị trí trong hội đồng
                    </label>

                    <select id="slotNo"
                            class="form-control-custom"
                            th:field="*{slotNo}"
                            required>

                        <option value="">
                            -- Chọn vị trí --
                        </option>

                        <option value="1">
                            1 - Chủ tịch
                        </option>

                        <option value="2">
                            2 - Thư ký
                        </option>

                        <option value="3">
                            3 - Ủy viên
                        </option>

                        <option value="4">
                            4 - Ủy viên
                        </option>

                        <option value="5">
                            5 - Ủy viên
                        </option>

                    </select>

                    <div class="field-error"
                         th:if="${#fields.hasErrors('slotNo')}"
                         th:errors="*{slotNo}">
                    </div>

                </div>

                <!-- Nút chức năng -->
                <div class="action-buttons">

                    <button class="council-btn btn-save"
                            type="submit">

                        <i class="bi bi-save"></i>
                        Lưu thành viên

                    </button>

                    <a class="council-btn btn-back"
                       th:href="@{/councils/{id}/members(id=${council.id})}">

                        <i class="bi bi-arrow-left"></i>
                        Quay lại

                    </a>

                </div>

            </form>

        </section>

    </div>

</main>

</body>
</html>
