<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Thêm thành viên hội đồng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            color: #263238;
            font-family: Arial, sans-serif
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08)
        }

        .container h1 {
            color: #1d4ed8;
            margin-top: 0
        }

        h2 {
            margin-top: 30px;
            color: #263238
        }

        .card {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0
        }

        .table-wrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left
        }

        th {
            background: #eff6ff;
            color: #173b66
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            font-size: 15px
        }

        .primary {
            background: #2563eb;
            color: #fff
        }

        .secondary {
            background: #64748b;
            color: #fff
        }

        .success {
            background: #15803d;
            color: #fff
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px
        }

        .form-row {
            margin: 18px 0
        }

        .form-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px
        }

        .form-control,
        .form-select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box
        }

        .error {
            color: #b91c1c;
            margin-top: 5px
        }

        .notice {
            padding: 12px;
            background: #eff6ff;
            color: #1e40af;
            border-radius: 6px;
            margin: 15px 0
        }
    </style>
</head>

<body class="py-4">

    <main layout:fragment="content">
        <div class="container">
            <h1>Thêm thành viên hội đồng</h1>
            <div class="notice">Hội đồng: <b th:text="${council.name}"></b></div>
            <form th:action="@{/councils/{id}/members/save(id=${council.id})}" th:object="${memberForm}" method="post">
                <div class="form-row"><label for="lecturerId">Mã giảng viên</label><input id="lecturerId"
                        class="form-control" type="number" th:field="*{lecturerId}">
                    <div class="error" th:if="${#fields.hasErrors('lecturerId')}" th:errors="*{lecturerId}"></div>
                </div>
                <div class="form-row"><label for="slotNo">Vị trí trong hội đồng</label><select id="slotNo"
                        class="form-select" th:field="*{slotNo}">
                        <option value="">-- Chọn vị trí --</option>
                        <option value="1">1 - Chủ tịch</option>
                        <option value="2">2 - Thư ký</option>
                        <option value="3">3 - Ủy viên</option>
                        <option value="4">4 - Ủy viên</option>
                        <option value="5">5 - Ủy viên</option>
                    </select>
                    <div class="error" th:if="${#fields.hasErrors('slotNo')}" th:errors="*{slotNo}"></div>
                </div>
                <div class="actions"><button class="btn primary" type="submit">Lưu thành viên</button><a
                        class="btn secondary" th:href="@{/councils/{id}/members(id=${council.id})}">Quay lại</a></div>
            </form>
        </div>
    </main>
</body>

</html>
