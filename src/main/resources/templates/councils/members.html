
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thành viên hội đồng</title>

    <style layout:fragment="css">
        .members-page {
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            color: #263238;
        }

        .members-page .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 22px;
        }

        .members-page .ribbon-title {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 10px 45px 10px 20px;
            background: #173e34;
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            clip-path: polygon(
                0 0, 100% 0,
                calc(100% - 20px) 100%,
                0 100%
            );
        }

        .members-page .content-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
            margin-bottom: 20px;
        }

        .members-page .card-heading {
            margin: 0 0 18px;
            color: #263238;
            font-size: 18px;
            font-weight: 700;
        }

        .members-page .info-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .members-page .info-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 7px;
        }

        .members-page .info-label {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .members-page .info-value {
            color: #1e293b;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .members-page .action-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .members-page .council-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 5px;
            text-decoration: none;
            border: none;
        }

        .members-page .btn-create {
            background: #2563eb;
            color: #fff;
        }

        .members-page .btn-back {
            background: #64748b;
            color: #fff;
        }

        .members-page .council-btn:hover {
            filter: brightness(.92);
            color: #fff;
        }

        .members-page .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .members-page .members-table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
        }

        .members-page .members-table th,
        .members-page .members-table td {
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        .members-page .members-table th {
            background: #f3f4f6;
            font-weight: 700;
            color: #1f2937;
        }

        .members-page .members-table tbody tr:hover {
            background: #f8fafc;
        }

        .members-page .role-badge {
            display: inline-block;
            border-radius: 5px;
            padding: 6px 11px;
            font-size: 12px;
            font-weight: 700;
        }

        .members-page .role-chair {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .members-page .role-secretary {
            background: #dcfce7;
            color: #166534;
        }

        .members-page .role-member {
            background: #fef3c7;
            color: #92400e;
        }

        .members-page .empty-message {
            text-align: center !important;
            padding: 30px !important;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .members-page {
                padding: 14px 12px;
            }

            .members-page .info-grid {
                grid-template-columns: 1fr;
            }

            .members-page .content-card {
                padding: 15px;
            }

            .members-page .ribbon-title {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<main layout:fragment="content">

    <div class="members-page">

        <!-- Thanh tiêu đề -->
        <div class="page-top">

            <div class="ribbon-title">
                THÀNH VIÊN HỘI ĐỒNG
            </div>

            <div class="action-buttons">

                <a sec:authorize="hasAnyRole('DEAN','DEPARTMENT_HEAD')"
                   class="council-btn btn-create"
                   th:href="@{/councils/{id}/members/new(id=${council.id})}">
                    <i class="bi bi-person-plus"></i>
                    Thêm thành viên
                </a>

                <a class="council-btn btn-back"
                   th:href="@{/councils}">
                    <i class="bi bi-arrow-left"></i>
                    Danh sách hội đồng
                </a>

            </div>

        </div>

        <!-- Thông tin hội đồng -->
        <section class="content-card">

            <h2 class="card-heading">
                <i class="bi bi-info-circle"></i>
                Thông tin hội đồng
            </h2>

            <div class="info-grid">

                <div class="info-item">
                    <span class="info-label">Tên hội đồng</span>

                    <span class="info-value"
                          th:text="${council.name}">
                        Hội đồng bảo vệ
                    </span>
                </div>

                <div class="info-item">
                    <span class="info-label">Mã đợt đăng ký</span>

                    <span class="info-value"
                          th:text="${council.roundId}">
                        1
                    </span>
                </div>

                <div class="info-item">
                    <span class="info-label">Trạng thái</span>

                    <span class="info-value"
                          th:text="${council.status}">
                        DRAFT
                    </span>
                </div>

            </div>

        </section>

        <!-- Danh sách thành viên -->
        <section class="content-card">

            <h2 class="card-heading">
                <i class="bi bi-people"></i>
                Danh sách thành viên hội đồng
            </h2>

            <div class="table-wrapper">

                <table class="members-table">

                    <thead>
                    <tr>
                        <th>Mã giảng viên</th>
                        <th>Vị trí</th>
                        <th>Vai trò</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="member : ${members}">

                        <td th:text="${member.id.lecturerId}">
                            1
                        </td>

                        <td th:text="${member.slotNo}">
                            1
                        </td>

                        <td>
                            <span class="role-badge role-chair"
                                  th:if="${member.slotNo == 1}">
                                Chủ tịch
                            </span>

                            <span class="role-badge role-secretary"
                                  th:if="${member.slotNo == 2}">
                                Thư ký
                            </span>

                            <span class="role-badge role-member"
                                  th:if="${member.slotNo >= 3}">
                                Ủy viên
                            </span>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="3" class="empty-message">
                            <i class="bi bi-inbox"></i>
                            Chưa có thành viên hội đồng.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

</main>

</body>
</html>
