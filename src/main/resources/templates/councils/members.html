<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Thành viên hội đồng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: #f4f6f9;
            color: #263238;
            font-family: Arial, sans-serif
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08)
        }

        .container h1 {
            color: #1d4ed8;
            margin-top: 0
        }

        h2 {
            margin-top: 30px;
            color: #263238
        }

        .card {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0
        }

        .table-wrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left
        }

        th {
            background: #eff6ff;
            color: #173b66
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: 0;
            cursor: pointer;
            font-size: 15px
        }

        .primary {
            background: #2563eb;
            color: #fff
        }

        .secondary {
            background: #64748b;
            color: #fff
        }

        .success {
            background: #15803d;
            color: #fff
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px
        }

        .form-row {
            margin: 18px 0
        }

        .form-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px
        }

        .form-control,
        .form-select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box
        }

        .error {
            color: #b91c1c;
            margin-top: 5px
        }

        .notice {
            padding: 12px;
            background: #eff6ff;
            color: #1e40af;
            border-radius: 6px;
            margin: 15px 0
        }
    </style>
</head>

<body class="py-4">

    <main layout:fragment="content">
        <div class="container">
            <h1>Thành viên hội đồng</h1>
            <div class="notice" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="card">
                <p><b>Tên hội đồng:</b> <span th:text="${council.name}"></span></p>
                <p><b>Đợt đăng ký:</b> <span th:text="${council.roundId}"></span></p>
                <p><b>Trạng thái:</b> <span th:text="${council.status}"></span></p>
            </div>
            <div class="actions">
                <a sec:authorize="hasAnyRole('DEAN','DEPARTMENT_HEAD')" class="btn primary"
                    th:href="@{/councils/{id}/members/new(id=${council.id})}">+ Thêm thành viên</a>
                <form sec:authorize="hasAnyRole('DEAN','DEPARTMENT_HEAD')"
                      th:if="${council.status.name() == 'DRAFT' and canActivate}"
                      th:action="@{/councils/{id}/activate(id=${council.id})}" method="post">
                    <button class="btn success" type="submit">Kích hoạt hội đồng</button>
                </form>
                <a class="btn secondary" href="/councils">Danh sách hội đồng</a>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Giảng viên ID</th>
                            <th>Vị trí</th>
                            <th>Vai trò</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="member : ${members}">
                            <td th:text="${member.id.lecturerId}"></td>
                            <td th:text="${member.slotNo}"></td>
                            <td><span th:if="${member.slotNo == 1}">Chủ tịch</span><span
                                    th:if="${member.slotNo == 2}">Thư
                                    ký</span><span th:if="${member.slotNo >= 3}">Ủy viên</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(members)}">
                            <td colspan="3">Chưa có thành viên.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
