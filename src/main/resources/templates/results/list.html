<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title>Kết quả bảo vệ</title>
</head>

<body>
    <div layout:fragment="content" class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2><i class="bi bi-award me-2"></i>Kết quả bảo vệ</h2>
                <p class="text-muted mb-0">D4 xác nhận điểm, D5 công bố kết quả cho sinh viên</p>
            </div>
            <a sec:authorize="hasRole('LECTURER') and !hasRole('STUDENT')" th:href="@{/results/new}"
                class="btn btn-primary">
                <i class="bi bi-calculator me-1"></i>Xác nhận kết quả
            </a>
        </div>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-info" sec:authorize="hasRole('STUDENT')">
            <i class="bi bi-info-circle me-2"></i>Chỉ kết quả đã công bố của nhóm bạn mới xuất hiện tại đây.
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3"><strong>Bảng kết quả</strong></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Hồ sơ</th>
                            <th>Nhóm</th>
                            <th>Đề tài</th>
                            <th>Điểm</th>
                            <th>Số phiếu</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="result : ${results}">
                            <td th:text="${'#' + result.registrationId}"></td>
                            <td th:text="${result.groupName}"></td>
                            <td><span class="fw-semibold" th:text="${result.topicCode}"></span>
                                <div class="small text-muted" th:text="${result.topicTitle}"></div>
                            </td>
                            <td><span class="badge bg-success fs-6" th:text="${result.finalScore + ' / 10'}"></span>
                            </td>
                            <td th:text="${result.componentCount}"></td>
                            <td>
                                <span th:if="${result.publishedAt != null}" class="badge text-bg-success">Đã công
                                    bố</span>
                                <span th:if="${result.publishedAt == null}" class="badge text-bg-warning">Chờ công
                                    bố</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/results/{id}(id=${result.id})}" class="btn btn-sm btn-outline-primary"><i
                                        class="bi bi-eye me-1"></i>Chi tiết</a>
                                <form sec:authorize="hasRole('DEAN') and !hasRole('STUDENT')"
                                    th:if="${result.publishedAt == null}"
                                    th:action="@{/dean/results/{id}/publish(id=${result.id})}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('Công bố kết quả này cho toàn bộ sinh viên trong nhóm?')">
                                    <button class="btn btn-sm btn-success" type="submit"><i
                                            class="bi bi-send-check me-1"></i>Công bố</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(results)}">
                            <td colspan="7" class="text-center text-muted py-5"><i
                                    class="bi bi-clipboard-x fs-2 d-block mb-2"></i>Chưa có kết quả phù hợp</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
