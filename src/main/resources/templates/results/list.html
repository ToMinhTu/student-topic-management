<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title>Kết quả bảo vệ</title>
</head>

<body>
    <div layout:fragment="content" class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2><i class="bi bi-award me-2"></i>Kết quả bảo vệ</h2>
                <p class="text-muted mb-0">Danh sách kết quả đã được tổng hợp</p>
            </div><a sec:authorize="hasRole('DEAN')" th:href="@{/results/new}" class="btn btn-primary"><i
                    class="bi bi-plus-lg me-1"></i>Tổng hợp kết quả</a>
        </div>
        <div class="alert alert-info" sec:authorize="hasRole('STUDENT')"><i class="bi bi-info-circle me-2"></i>Bạn chỉ
            có thể xem kết quả của nhóm mình.</div>
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3"><strong>Bảng kết quả</strong></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Mã kết quả</th>
                            <th>Mã hồ sơ</th>
                            <th>Điểm cuối</th>
                            <th>Số phiếu</th>
                            <th>Kết luận</th>
                            <th>Ngày xác nhận</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="result : ${results}">
                            <td th:text="${result.id}"></td>
                            <td th:text="${result.registrationId}"></td>
                            <td><span class="badge bg-success fs-6" th:text="${result.finalScore + ' / 10'}"></span>
                            </td>
                            <td th:text="${result.componentCount}"></td>
                            <td th:text="${result.conclusion}"></td>
                            <td th:text="${#temporals.format(result.confirmedAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-end"><a th:href="@{/results/{id}(id=${result.id})}"
                                    class="btn btn-sm btn-outline-primary"><i class="bi bi-eye me-1"></i>Chi tiết</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(results)}">
                            <td colspan="7" class="text-center text-muted py-5"><i
                                    class="bi bi-clipboard-x fs-2 d-block mb-2"></i>Chưa có kết quả được công bố</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-3"><a th:href="@{/evaluations}" sec:authorize="hasAnyRole('LECTURER','DEAN')"
                class="btn btn-link"><i class="bi bi-arrow-left me-1"></i>Quản lý phiếu chấm</a></div>
    </div>
</body>

</html>
