<!-- toan-D3 -->
<!-- toan-D3 - thêm chức năng tổng hợp kết quả -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết kết quả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <h1>Chi tiết kết quả</h1>

    <p>
        ID kết quả:
        <span th:text="${result.id}"></span>
    </p>

    <p>
        Mã hồ sơ:
        <span th:text="${result.registrationId}"></span>
    </p>

    <p>
        Điểm cuối:
        <span th:text="${result.finalScore}"></span>
    </p>

    <p>
        Số phiếu chấm:
        <span th:text="${result.componentCount}"></span>
    </p>

    <p>
        Kết luận:
        <span th:text="${result.conclusion}"></span>
    </p>

    <p>
        Người xác nhận:
        <span th:text="${result.confirmedBy}"></span>
    </p>

    <p>
        Thời gian xác nhận:
        <span th:text="${result.confirmedAt}"></span>
    </p>

    <a href="/results">
        Quay lại danh sách
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
