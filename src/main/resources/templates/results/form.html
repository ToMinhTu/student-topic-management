<!-- toan-D3 - thêm chức năng tổng hợp kết quả -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tổng hợp kết quả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <h1>Tổng hợp kết quả</h1>

    <form th:action="@{/results/consolidate}" th:object="${resultForm}" method="post">

        <label>Mã hồ sơ:</label>
        <input type="number" th:field="*{registrationId}">

        <p th:if="${#fields.hasErrors('registrationId')}" th:errors="*{registrationId}">
        </p>

        <br>

        <label>Mã người xác nhận:</label>
        <input type="number" th:field="*{confirmedBy}">

        <p th:if="${#fields.hasErrors('confirmedBy')}" th:errors="*{confirmedBy}">
        </p>

        <br>

        <label>Kết luận:</label>
        <input type="text" th:field="*{conclusion}">

        <p th:if="${#fields.hasErrors('conclusion')}" th:errors="*{conclusion}">
        </p>

        <br><br>

        <button type="submit">
            Tổng hợp kết quả
        </button>

    </form>

    <br>

    <a href="/results">
        Quay lại danh sách
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
