<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><meta charset="UTF-8"><title>Chọn đề tài phân công GVHD</title><th:block layout:fragment="css"><link rel="stylesheet" th:href="@{/css/part-b.css}"></th:block>
</head>
<body>
<main layout:fragment="content" class="part-b-page">
    <div class="b-page-heading"><h1 class="page-title-tab mb-0">Phân công giảng viên hướng dẫn</h1></div>
    <p class="text-muted">Chọn đề tài để xem giảng viên hướng dẫn. Chỉ đề tài DRAFT chưa có đăng ký APPROVED được thay đổi phân công.</p>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <div class="b-table-scroll"><table class="table table-striped align-middle mb-0">
                <thead><tr><th>Mã đề tài</th><th>Tên đề tài</th><th>ID đợt</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="topic : ${topics.content}">
                    <td th:text="${topic.code}"></td><td th:text="${topic.title}"></td>
                    <td th:text="${topic.roundId}"></td><td th:text="${topic.status}"></td>
                    <td><a class="btn btn-outline-primary btn-sm"
                           th:href="@{/dean/topics/{topicId}/supervisors(topicId=${topic.id})}">Xem / phân công</a></td>
                </tr>
                <tr th:if="${topics.empty}"><td colspan="5" class="text-center p-4">Không có đề tài để hiển thị.</td></tr>
                </tbody>
            </table></div>
        </div>
    </div>
    <nav th:if="${topics.totalPages > 1}" class="d-flex align-items-center gap-3 mt-3" aria-label="Phân trang đề tài">
        <a th:if="${topics.hasPrevious()}" class="btn btn-outline-secondary btn-sm"
           th:href="@{/dean/topics/supervisors(page=${topics.number - 1})}">Trang trước</a>
        <span th:text="|Trang ${topics.number + 1} / ${topics.totalPages}|"></span>
        <a th:if="${topics.hasNext()}" class="btn btn-outline-secondary btn-sm"
           th:href="@{/dean/topics/supervisors(page=${topics.number + 1})}">Trang sau</a>
    </nav>
</main>
</body>
</html>
