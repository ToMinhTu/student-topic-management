spring:
  application:
    name: student-topic-management
  config:
    import: optional:file:.env[.properties] # auto nap file .env
  # MySQL
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?connectionTimeZone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Jpa/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Kiem tra code co khop vs DB, thay vi tu tao bang
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: true
  profiles:
    active: dev # dev: code | prod: release
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m #h, m, s
      cookie:
        http-only: true
        same-site: lax